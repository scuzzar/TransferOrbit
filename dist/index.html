<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10162b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TransferOrbit – prototype</title>
<!-- no icon yet; saying so keeps the browser from asking for /favicon.ico -->
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
/* Always dark, as in the mockups */
  color-scheme: dark;
  --bg:#10162b; --panel:#171f3b; --line:#2b3662; --text:#e7e9f2; --muted:#9aa2c2;
  --accent:#f2b33d; --accent-ink:#1a1400; --good:#5cc9a0; --warn:#e6c14b; --bad:#ec7a7e;
  --orbit:#27315a; --sun:#f5b544;
}
*{box-sizing:border-box}
main{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Saira Semi Condensed','Arial Narrow',system-ui,sans-serif;font-size:16px;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:14px 14px 48px}
h1{font-size:1.75rem;font-weight:700;margin:0;letter-spacing:.01em;line-height:1.1}
h2{font-size:1.05rem;font-weight:600;margin:22px 0 8px}
.date{color:var(--muted);text-align:right;font-size:.95rem;white-space:nowrap}
@media (max-width:899px){ h1{font-size:1.45rem} }
.date b{color:var(--text);font-weight:600;display:block;font-size:1.05rem}
.stats{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.gauge{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stage{position:relative;margin-top:12px}
canvas{display:block;width:100%;aspect-ratio:1/1;touch-action:manipulation}
#sys{aspect-ratio:1.6/1}
canvas[hidden]{display:none!important}
/* Stack: 2D behind (#cvb), three.js in the middle (#glc), 2D in front (#cv/#sys).
   All four sit inside .cwrap. That box is the element the stage centres, and the front
   canvas gives it its size. The rear layers are positioned absolutely at its top left
   corner and therefore line up by themselves - even when the layout changes without a
   redraw (for instance when the autopilot bar appears). */
.cwrap{position:relative;min-width:0}
#cvb,#glc{position:absolute;top:0;left:0;width:auto;aspect-ratio:auto;pointer-events:none}
#cv,#sys{position:relative}
.maptabs{display:flex;align-items:center;gap:6px;margin:12px 0 6px}
.maptabs button{min-height:36px;padding:4px 12px;font-size:.9rem;font-weight:600;color:var(--muted)}
.maptabs button[aria-selected="true"]{color:var(--text);border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.maptabs .auto{margin-left:auto;font-size:.8rem;color:var(--muted)}
.maptabs button.linky{border:none;padding:4px 0;min-height:32px;font-size:.8rem;font-weight:500;color:var(--accent);text-decoration:underline;box-shadow:none}
.legend{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.msg{margin-top:12px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--panel);font-size:.95rem}
/* Route plan */
.sys{display:flex;align-items:flex-start;flex:0 0 auto}
.sys + .sys{margin-left:6px}
.st{position:relative;flex:0 0 auto;width:78px;text-align:center;font-size:.8rem;color:var(--muted)}
.st::before{content:"";position:absolute;top:9px;left:0;right:0;height:4px;background:var(--line)}
.st:first-child::before{left:50%}
.st:last-child::before{right:50%}
.st span{position:relative;display:block;width:22px;height:22px;margin:0 auto 4px;border-radius:50%;
  border:3px solid var(--line);background:var(--bg)}
.st.here{color:var(--text);font-weight:600}
.st.here span{background:var(--accent);border-color:var(--accent)}
/* Actions */
.acts{display:flex;flex-direction:column;gap:6px}
.lat{width:28px;height:28px;flex:0 0 auto}
.lat circle,.lat line{fill:none;stroke:var(--muted);stroke-width:1.2}
.lat line{stroke-dasharray:2 2}
.lat circle.p{fill:var(--accent);stroke:none}
button{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--text);
  padding:6px 12px;cursor:pointer;min-height:36px}
button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto;transform:translateY(-1px)}
.num{font-variant-numeric:tabular-nums;font-size:.92rem}
.num.short{color:var(--bad)}
.wait{display:flex;gap:6px;flex-wrap:wrap}
/* Layout: one column on mobile (tiles, map, location); on desktop the map fills the left at full height, with a narrow column on the right */
.layout{display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:stretch;margin-top:0}
.stats .card{display:flex;flex-direction:column;gap:2px}
.stats .muted{font-size:.8rem}
.chead{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.cardbtn{font:inherit;font-weight:400;text-align:left;color:var(--text);cursor:pointer;min-height:0;padding:8px 10px}
.cardbtn:hover{border-color:var(--accent)}
.tchip{min-height:24px;padding:0 8px;font-size:.72rem;border-radius:12px;color:var(--muted);line-height:1}
.tchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.maptabs{margin:0}
.maptabs .date{margin-left:8px;font-size:.8rem;line-height:1.15;flex:0 0 auto}
.maptabs .crumbs{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.maptabs .crumbs::-webkit-scrollbar{display:none}
@media (max-width:899px){
  .maptabs{gap:2px}
  .maptabs .crumbs button{font-size:.85rem;padding:4px 3px}
  .maptabs .date #mday, .maptabs span.auto:not(:has(button)){display:none!important}
  .toast{font-size:.8rem;padding:5px 8px}
  .pbtns{gap:5px}
  .pbtns button{font-size:.82rem;padding:4px 6px;gap:4px}
  .pbtns svg{width:16px;height:16px}
  .stats .card{padding:7px 9px}
  .stat{font-size:1.15rem}
}
.maptabs .date b{font-size:.9rem}
.iconbtn{min-height:36px;min-width:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border-color:transparent}
.iconbtn:hover{color:var(--text)}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:40px;z-index:20;min-width:250px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.menu[hidden]{display:none}
.menu>button{border:none;text-align:left;min-height:40px;padding:6px 10px}
.menu>button:hover{background:rgba(255,255,255,.05)}
.menu .mdanger{color:var(--bad)}
.menu .mdanger.armed{background:var(--bad);color:#1a0808;border-radius:6px}
.msep{height:1px;background:var(--line);margin:4px 2px}
.mlabel{font-size:.8rem;color:var(--muted);padding:2px 10px}
.mwait{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:2px 4px 4px}
.mwait button{min-height:36px;padding:0 2px;font-size:.8rem;white-space:nowrap}
.mfoot{font-size:.78rem;color:var(--muted);padding:4px 10px 2px}
.stage{position:relative;margin-top:4px;display:flex;justify-content:center;align-items:center}
.infobtn{position:absolute;right:6px;bottom:6px;width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;font-weight:700;font-style:italic;font-family:Georgia,serif;color:var(--muted);background:rgba(16,22,43,.75)}
.infobtn[aria-expanded="true"]{color:var(--accent);border-color:var(--accent)}
.legendpop{position:absolute;right:6px;bottom:44px;max-width:min(320px,calc(100% - 12px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;color:var(--muted);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.legendpop[hidden]{display:none}
.toast{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 56px);background:rgba(23,31,59,.94);border-left:3px solid var(--accent);border-radius:4px;padding:7px 10px;font-size:.88rem;pointer-events:none;transition:opacity .4s}
.toast[hidden]{display:none}
.speedhint{position:absolute;right:6px;top:6px;font-size:.78rem;color:var(--muted);background:rgba(16,22,43,.75);border:1px solid var(--line);border-radius:12px;padding:2px 9px;pointer-events:none}
.speedhint.on{color:var(--accent);border-color:var(--accent)}
.speedhint[hidden]{display:none}
.toast.fade{opacity:0}
.col-side{display:flex;flex-direction:column;gap:10px;min-width:0}
#mainview{display:flex;flex-direction:column;gap:10px}
#mainview:empty,#rescue:empty,#pickcard:empty{display:none}
#mainview[hidden]{display:none}
.rescue{margin-top:0}
.pick{margin-top:0}
/* Location, compact */
.place{margin-top:0;padding:10px 12px;gap:8px}
.phdr{display:flex;flex-wrap:wrap;align-items:flex-start;gap:2px 12px}
.phdr .pname{flex:0 1 auto;min-width:0}
.phdr .pname b{font-size:1.05rem;font-weight:700;display:block;line-height:1.2}
.phdr .kinfo{flex:1 1 180px;font-size:.85rem;margin:0;line-height:1.3}
.phdr .tag{margin-left:auto;align-self:flex-start}
/* Flex, not a fixed grid: the buttons size to their text and only shrink when the row
   is genuinely too narrow. With fixed columns "Orders (10)" lost its digits. */
.pbtns{display:flex;gap:6px}
.pbtns button{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:4px 8px;font-size:.88rem;white-space:nowrap}
.pbtns button.full{flex-basis:100%}
.pbtns svg{flex:0 0 auto}
.pbtns button span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.olink{border:none;background:none;padding:0 2px;min-height:28px;color:var(--accent);font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.olink:hover{text-decoration:underline}
.rtank{display:flex;flex-direction:column;gap:6px;padding:8px 0 2px;border-top:1px solid var(--line)}
.rtank .two button{font-size:.88rem;line-height:1.2;padding:6px 8px}
.rtank .linkbtn{font-size:.85rem;min-height:28px}
.og-head .row{align-items:flex-start}
@media (min-width: 900px){
  main{max-width:1500px;padding:12px 20px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"map stats" "map side";gap:10px 24px;height:calc(100vh - 24px);height:calc(100dvh - 24px)}
  .stats{grid-area:stats}
  .col-map{grid-area:map;display:flex;flex-direction:column;min-height:0}
  .stage{flex:1 1 auto;min-height:0}
  .col-side{grid-area:side;min-height:0;overflow-y:auto;padding-bottom:4px}
  .pfoot{position:sticky;bottom:0}
}
h3{font-size:.98rem;font-weight:600;margin:14px 0 6px}
.money{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:2px}
.money b{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.money b.neg{color:var(--bad)}
.money span{color:var(--muted);font-size:.9rem}
.post h2 .tag,.tag{font-size:.75rem;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid var(--accent);color:var(--accent);vertical-align:middle}
.kinfo{color:var(--muted);font-size:.9rem;margin:0 0 6px}
.needs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;margin-bottom:6px}
.need{display:inline-flex;align-items:center;gap:6px}
.gchip{width:10px;height:10px;border-radius:2px;display:inline-block;flex:0 0 auto}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line)}
.dots i.on{background:var(--good);border-color:var(--good)}
.order{padding:9px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.o-top{display:flex;align-items:baseline;gap:8px}
.o-top b{flex:1;font-weight:600}
.o-top .gchip{transform:translateY(-1px)}
.o-meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:.85rem;margin-top:3px}
.o-meta .late{color:var(--bad)}
.o-warn{font-size:.85rem;color:var(--warn);margin-top:4px}
.o-warn.bad{color:var(--bad)}
.o-note{font-size:.85rem;color:var(--muted);margin-top:4px}
.o-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:4px;margin-bottom:6px}
.slots i{height:22px;border-radius:4px}
.slots i.free{border:1.5px dashed var(--line)}
.rescue{margin-top:10px;padding:10px 12px;border:1px solid var(--bad);border-radius:8px;background:var(--panel)}
.rescue p{margin:0 0 8px;font-size:.95rem}
.muted{color:var(--muted)} .small{font-size:.8rem} .acc{color:var(--accent)} .big{font-size:1.15rem;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.stat{display:block;font-size:1.3rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{font-size:.75rem;font-weight:500;color:var(--muted)}
.stat.neg{color:var(--bad)}
.mslots{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 3px}
.mslots i{flex:1 0 10px;max-width:22px;height:11px;border-radius:3px;border:1.5px solid var(--line)}
.mslots i[style]{border-color:transparent}
#shipinfo{margin-top:6px}
#shipinfo.risk{color:var(--warn)}
.lifebar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.lifebar i{display:block;height:100%}
.namerow{display:flex;gap:8px;align-items:center}
.namerow input{flex:1;min-width:0;min-height:40px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.board{width:100%;border-collapse:collapse;font-size:.92rem}
.board th{text-align:left;color:var(--muted);font-weight:500;font-size:.8rem;padding:6px 4px;border-bottom:1px solid var(--line)}
.board td{padding:8px 4px;border-bottom:1px solid var(--line)}
.board td.num,.board th.num{text-align:right;font-variant-numeric:tabular-nums}
.place{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.place .kinfo{margin:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.two button{min-height:44px}
.span2{grid-column:1/-1}
button.wide{width:100%;min-height:48px;font-size:1rem}
.phead{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;border:none;padding:6px 4px;color:var(--muted);min-height:44px}
.ptitle{font-size:1.5rem;font-weight:700;margin:0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1.5px solid var(--good);border-radius:8px;margin-bottom:8px}
label.order{display:block;cursor:pointer}
.order.pick input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:0 0 auto;align-self:center}
.order.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.order.dis{opacity:.6;cursor:not-allowed}
.needgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;font-size:.9rem}
.needgrid .card{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pfoot{position:sticky;bottom:0;margin:14px -14px -48px;padding:12px 14px 18px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pfoot .dvrow{justify-content:flex-start}
.bigslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.bigslots div{height:56px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;color:#10162b;text-align:center;padding:2px;line-height:1.15}
.bigslots div b{font-weight:600}
.bigslots .free{border:1.5px dashed var(--line);color:var(--muted)}
.massbox{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.massbox p{margin:4px 0 0}
.massbar{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--line)}
.legendrow{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)}
.legendrow i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.linkbtn{align-self:flex-start;border:none;padding:4px 0;color:var(--accent);text-decoration:underline;min-height:32px}
.due{margin-top:6px;font-size:.85rem;color:var(--muted)}
.due .ok{color:var(--good)} .due .late{color:var(--bad)}
.fbar{height:5px;border-radius:3px;background:var(--line);margin-top:3px;overflow:hidden}
.fbar i{display:block;height:100%}
.tankbox{display:flex;flex-direction:column;gap:8px}
.tankbox .big{font-size:1.5rem}
.tankbox input[type=range]{width:100%;height:32px;accent-color:var(--accent);margin:0}
.cmp{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{display:flex;flex-direction:column}
.cmp b{font-size:1.4rem}
.cmp p{grid-column:1/-1;margin:0;font-size:.92rem}
.pricelist div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.pricelist .me{font-weight:600}
.shipcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.shipcard.mine{opacity:.85}
.shipcard .r{text-align:right}
.stats3s{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:.85rem}
.stats3s>div{display:flex;flex-direction:column}
.stats3s b{font-size:1.05rem}
.up{color:var(--good)} .down{color:var(--bad)}
.mtags{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.tag.fuel,.tag.nofuel{display:inline-flex;align-items:center;gap:3px}
.tag.fuel{border-color:var(--good);color:var(--good)}
.tag.nofuel{border-color:var(--line);color:var(--muted);opacity:.75}
.mtag{font-size:.75rem;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mtag.deliver{background:var(--good);border-color:var(--good);color:#0c1a14}
.mtag.toward{border-color:var(--good);color:var(--good)}
.mtag.post{border-color:var(--accent);color:var(--accent)}
@media (max-width:899px){ body.panel-open .col-map, body.panel-open .stats{display:none} }
@media (min-width:900px){ .pfoot{margin:14px 0 0;border:1px solid var(--line);border-radius:10px} }

.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;min-width:0}
.crumbs button{border:none;padding:4px 5px;min-height:36px;font-size:.9rem;color:var(--muted);background:none}
.crumbs button.cur{color:var(--text);font-weight:700}
.crumbs .sep{color:var(--line);font-weight:700}
.autobar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;border:1.5px solid var(--accent);border-radius:10px;background:var(--panel);font-size:.95rem}
.autobar[hidden]{display:none}
.pick{margin-top:10px;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pick .kinfo{margin:0}
.pick .x{border:none;min-height:36px;min-width:36px;padding:0;font-size:1.4rem;line-height:1;color:var(--muted)}
.pstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:.85rem}
.pstats>div{display:flex;flex-direction:column}
.pstats b{font-size:1.05rem}
.pstats .ok,.okc{color:var(--good)} .pstats .wait{color:var(--warn)} .badc{color:var(--bad)}
.porders h3{margin:0 0 2px;font-size:.9rem}
.porders .hint{margin:4px 0 0}
.pgroup{margin-top:8px}
.pg-head{padding:4px 0 4px;font-size:.9rem}
.pg-head .og-meta{margin-top:1px;font-size:.8rem}
.pgroup .prow{padding-left:8px}
.porders .linkbtn{margin-top:4px;font-size:.88rem}
.prow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(43,54,98,.5);font-size:.9rem}
.prow .ot{flex:1;display:flex;flex-direction:column;line-height:1.2}
.prow .ot b{font-weight:600}
.prow .ot small{color:var(--muted)}
.mtag.here{border-color:var(--text);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border-radius:18px;min-height:38px;font-size:.88rem;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.bad:not(.on){color:var(--bad)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.timeline li:not(.last)::before{content:"";position:absolute;left:5px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline .dot{flex:0 0 12px;height:12px;border-radius:50%;border:2px solid var(--muted);margin-top:5px;background:var(--bg)}
.timeline li.first .dot{background:var(--accent);border-color:var(--accent)}
.timeline li.wait .dot{border-color:var(--warn)}
.timeline li.last .dot{background:var(--good);border-color:var(--good)}
.timeline .tx{flex:1;display:flex;flex-direction:column}
.timeline .tx small{color:var(--muted)}
.timeline .num{white-space:nowrap;font-weight:600}
.stepctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip.small{min-height:30px;font-size:.8rem;padding:2px 10px}
.tmap{margin-top:8px}
.tmap canvas{display:block;border-radius:6px;cursor:crosshair}
.tmap .hint{margin:0 0 6px}
.tmap-read{margin:6px 0 4px;font-size:.85rem;color:var(--muted)}
.tmap-read b{color:var(--text)}
.tmap-legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.75rem;color:var(--muted)}
.tmap-legend span{display:inline-flex;align-items:center;gap:4px}
.tmap-legend i{display:inline-block;width:14px;height:10px;border-radius:2px}
.tmap-legend i.over{background:repeating-linear-gradient(45deg,#232a45 0 3px,#3a4263 3px 4px)}
.tmap-legend i.dl{height:0;border-top:2px dashed var(--accent);border-radius:0}
.ogroups{display:flex;flex-direction:column;gap:10px}
.ogroup{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ogroup.on{border-color:var(--accent)}
.og-head{padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.og-title{font-size:1rem}
.og-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85rem;color:var(--muted);margin-top:2px}
.og-meta span:first-child{color:var(--text);font-weight:600}
.og-meta span.badc{color:var(--bad)}
.orow{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:48px;cursor:pointer;border-top:1px solid rgba(43,54,98,.5)}
.orow:first-of-type{border-top:none}
.orow input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:0 0 auto}
.orow .ot{flex:1;display:flex;flex-direction:column;line-height:1.2}
.orow .ot b{font-weight:600}
.orow .ot small{color:var(--muted)}
.orow.on{background:rgba(242,179,61,.08)}
.orow.dis{opacity:.55;cursor:not-allowed}
@media (prefers-reduced-motion: reduce){ .gauge i{transition:none} }

<body>
<main>
  <div class="layout">
  <div class="stats" id="stats">
    <div class="card"><div class="muted">Balance</div><b class="stat" id="credits"></b></div>
    <div class="card"><div class="chead"><span class="muted">Δv with cargo</span><button type="button" id="autofill" class="tchip" aria-pressed="false" title="Automatically fill up at every fuel depot">Always full</button></div><b class="stat" id="dv"></b><div class="gauge"><i id="gauge"></i></div></div>
    <button type="button" class="card cardbtn" id="cargotile" aria-label="Open the cargo hold"><div class="chead"><span class="muted">Cargo hold</span><span class="muted small" id="slotinfo"></span></div><div class="mslots" id="mslots"></div></button>
    <button type="button" class="card cardbtn" id="shiptile" aria-label="Open ship and pilot"><div class="muted">Ship and pilot</div><b class="stat" id="shipname"></b><div class="muted small" id="shipinfo"></div></button>
  </div>

  <div class="col-map">
  <div id="autobar" class="autobar" hidden></div>
  <div class="maptabs">
    <nav id="crumbs" class="crumbs" aria-label="Map level"></nav>
    <span class="auto" id="mapauto"></span>
    <div class="date"><b id="date"></b><span id="mday"></span></div>
    <button type="button" id="fs" class="iconbtn" hidden aria-label="Fullscreen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div class="menuwrap">
      <button type="button" id="menubtn" class="iconbtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div id="menu" class="menu" hidden>
        <button type="button" data-menu="fs" id="menufs" hidden>Fullscreen</button>
        <button type="button" data-menu="save">Save</button>
        <button type="button" data-menu="load">Load</button>
        <button type="button" data-menu="leaderboard">Leaderboard</button>
        <div class="msep"></div>
        <div class="mlabel">Let time pass</div>
        <div class="mwait">
          <button type="button" data-wait="10">+10 d</button><button type="button" data-wait="30">+30 d</button><button type="button" data-wait="100">+100 d</button><button type="button" data-wait="365">+1 y</button>
        </div>
        <div class="msep"></div>
        <button type="button" data-menu="reset" class="mdanger">Start over</button>
        <div class="mfoot" id="used"></div>
        <div class="mfoot" id="ver"></div>
      </div>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="cwrap">
      <canvas id="cvb" aria-hidden="true" hidden></canvas>
      <canvas id="glc" aria-hidden="true" hidden></canvas>
      <canvas id="cv" aria-label="Solar system, seen from above"></canvas>
      <canvas id="sys" aria-label="Planet with its moons" hidden></canvas>
    </div>
    <button type="button" id="infobtn" class="infobtn" aria-label="Legend" aria-expanded="false">i</button>
    <div id="legend" class="legendpop" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="speedhint" class="speedhint" hidden></div>
  </div>
  </div>

  <div class="col-side">
  <div id="panel" hidden></div>
  <div id="mainview">
    <div id="rescue"></div>
    <div id="pickcard"></div>
    <div id="placecard"></div>
  </div>
  </div>
  </div>
</main>

<!-- The game lives in ES modules under js/. start.ts wires it all together;
     every module says in its first line what it is responsible for.
     Vite serves it in dev and bundles it into a single file in build. -->
</body>
</html>
