  [[[-12,20],[0,28],[20,30],[32,24],[34,16],[15,14],[-5,15]],'rgba(196,170,112,0.75)'],
  [[[40,16],[55,22],[56,27],[48,29],[40,26]],'rgba(196,170,112,0.7)'],
  [[[125,-22],[140,-24],[140,-30],[125,-30]],'rgba(196,170,112,0.6)'],
];
const EARTH_LAND = i => i===1 ? 'rgba(236,240,244,0.92)' : 'rgba(104,146,86,0.95)'; // 1 = Grönland (Eis)

// ---------- 3D-Ansicht der Himmelskörper: echte Geometrie, feste leicht schräge Kamera ----------
const D2R = Math.PI/180;
const CAM_EL = 22*D2R;                 // Kamera 22° über (oder unter) der Äquatorebene
const R_ORB = 1.3, R_HIGH = 1.62;      // Bahnradien in Körperradien (überhöht, damit man sie sieht)
const LIGHT = (()=>{ const v=[-0.5,0.3,0.78], n=Math.hypot(...v); return v.map(x=>x/n); })(); // Licht von links oben vorn
const vadd=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], vmul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const vdot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], vnorm=a=>vmul(a,1/(Math.hypot(...a)||1));
// Blickmitte je Körper: so, dass möglichst viele Landeplätze auf der Vorderseite liegen
const VIEW = {};
function bodyView(b){
  if(VIEW[b]) return VIEW[b];
  const st=SITES[b]||[]; let best={lon:0,el:CAM_EL}, bs=-1e9;
  for(const el of [CAM_EL,-CAM_EL]) for(let L=-180; L<180; L+=5){
    if(b==='earth' && (L!==EARTH_LON0 || el<0)) continue; // Erde: Blick auf den Atlantik von Norden
    let s=0; st.forEach(x=>{ const f=x.lat*D2R, d=(x.lon-L)*D2R;
      const z=Math.sin(f)*Math.sin(el)+Math.cos(f)*Math.cos(d)*Math.cos(el); s+=(z>0.12?10:0)+z+(x.port?3*(z>0.12):0); });
    if(el<0) s-=0.5; // bei Gleichstand lieber von Norden
    if(s>bs){ bs=s; best={lon:L,el}; }
  }
  return VIEW[b]=best;
}
const bodyLon0 = b => bodyView(b).lon;
// Körperfester Einheitsvektor (Y = Nordpol, Z = zur Blickmitte)
const bvec=(b,lat,lon)=>{ const f=lat*D2R, L=(lon-bodyLon0(b))*D2R; return [Math.cos(f)*Math.sin(L), Math.sin(f), Math.cos(f)*Math.cos(L)]; };
function makeCam(cx,cy,R,el){
  const ce=Math.cos(el), se=Math.sin(el);
  const view=p=>[p[0], p[1]*ce-p[2]*se, p[1]*se+p[2]*ce];
  // hidden: hinter dem Körper verdeckt
  const proj=p=>{ const q=view(p); return {x:cx+R*q[0], y:cy-R*q[1], z:q[2], hidden:q[2]<0 && q[0]*q[0]+q[1]*q[1]<1}; };
  return {view, proj, cx, cy, R};
}
// Bahn: Neigung i, aufsteigender Knoten Om (Länge), Position über Argument u
function orbitPos(b,o,u,r){ const N=bvec(b,0,o.Om), M=bvec(b,o.i,o.Om+90); return vmul(vadd(vmul(N,Math.cos(u)),vmul(M,Math.sin(u))),r); }
// Bahn, die ostwärts über einen Landeplatz führt (Start genau nach Osten)
function siteOrbit(st){ const i=Math.abs(st.lat); return st.lat>=0 ? {i, Om:st.lon-90, uSite:90*D2R} : {i, Om:st.lon+90, uSite:270*D2R}; }
const defaultOrb = b => ({body:b, i:0, Om:bodyLon0(b)-90, u:90*D2R});
const shipOrb = b => (S.orb && S.orb.body===b) ? S.orb : defaultOrb(b);
// Kepler: exzentrische Anomalie aus mittlerer, dann wahre Anomalie
function keplerNu(M,e){ let E=M; for(let k=0;k<8;k++) E-= (E-e*Math.sin(E)-M)/(1-e*Math.cos(E)); return 2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2), Math.sqrt(1-e)*Math.cos(E/2)); }
const easeIn = t=>t*t, easeOut = t=>1-(1-t)*(1-t);

// Flugbahn eines Manövers im Körperrahmen: at(t) -> {p, burn:'pro'|'retro'|null, glow}
function bodyPath(mv){
  const [fb,fl]=mv.from.node.split('.'), [tb,tl]=mv.to.node.split('.'), b=fb;
  const atm=hasAtm(b);
  // Start: senkrecht hoch, dann nach Osten in die Kreisbahn
  if(fl==='surf' && tl==='orbit' && fb===tb){
    const st=siteOf(b,mv.from.site)||{lat:0,lon:bodyLon0(b)}, o=siteOrbit(st), du=75*D2R;
    return {b, finalOrb:{body:b,i:o.i,Om:o.Om,u:o.uSite+du},
      at:t=>({p:orbitPos(b,o,o.uSite+du*easeIn(t),1+(R_ORB-1)*easeOut(t)), burn:t<0.88?'pro':null})};
  }
  // Landung: im alten Orbit bis zum Bremspunkt gleiten (Bahnebene dreht sich zur Landebahn), bremsen, absteigen, senkrecht aufsetzen
  if(fl==='orbit' && tl==='surf' && fb===tb){
    const st=siteOf(b,mv.to.site)||{lat:0,lon:bodyLon0(b)}, o=siteOrbit(st), c=mv.orb||shipOrb(b), arc=110*D2R;
    const uDe=o.uSite-arc; let du=((uDe-c.u)%TAU+TAU)%TAU; if(du<0.6) du+=TAU;
    const dOm=((o.Om-c.Om+540)%360)-180;
    return {b, finalOrb:null, at:t=>{
      if(t<0.38){ const s=t/0.38; const oo={i:c.i+(o.i-c.i)*s, Om:c.Om+dOm*s}; return {p:orbitPos(b,oo,c.u+du*s,R_ORB), burn:s>0.92?'retro':null}; }
      const s=(t-0.38)/0.62;
      return {p:orbitPos(b,o,uDe+arc*easeOut(s),R_ORB-(R_ORB-1)*easeIn(s)), burn:(s<0.07||s>0.7)?'retro':null, glow:atm&&s>0.25&&s<0.68, att:'retro'};
    }};
  }
  // Hüpfer: ballistischer Bogen entlang des Großkreises
  if(fl==='surf' && tl==='surf' && fb===tb){
    const A=siteOf(b,mv.from.site), Bs=siteOf(b,mv.to.site); if(!A||!Bs) return null;
    const a=bvec(b,A.lat,A.lon), c=bvec(b,Bs.lat,Bs.lon), th=Math.acos(Math.max(-1,Math.min(1,vdot(a,c))));
    const T=vnorm(vadd(c,vmul(a,-Math.cos(th)))), h=0.06+0.32*th/Math.PI;
    return {b, finalOrb:null, at:t=>{ const r=1+h*4*t*(1-t), w=th*t; return {p:vmul(vadd(vmul(a,Math.cos(w)),vmul(T,Math.sin(w))),r), burn:t<0.1?'pro':t>0.9?'retro':null}; }};
  }
  // Orbit anheben (Hohmann, halbe Ellipse mit Kepler-Tempo)
  if(fl==='orbit' && tl==='capt' && fb===tb){
    const c=mv.orb||shipOrb(b), rp=R_ORB, ra=R_HIGH, a=(rp+ra)/2, e=(ra-rp)/(ra+rp);
    return {b, finalOrb:null, at:t=>{ const nu=keplerNu(Math.PI*t,e); const r=a*(1-e*e)/(1+e*Math.cos(nu)); return {p:orbitPos(b,c,c.u+nu,r), burn:t<0.06||t>0.94?'pro':null}; }};
  }
  // Orbit absenken (umgekehrter Hohmann, endet vorne)
  if(fl==='capt' && tl==='orbit' && fb===tb){
    const o=defaultOrb(b), rp=R_ORB, ra=R_HIGH, a=(rp+ra)/2, e=(ra-rp)/(ra+rp), uEnd=o.u;
    return {b, finalOrb:{...o}, at:t=>{ const nu=keplerNu(Math.PI+Math.PI*t,e); const r=a*(1-e*e)/(1+e*Math.cos(nu)); return {p:orbitPos(b,o,uEnd-Math.PI+(nu-Math.PI),r), burn:t<0.06||t>0.94?'retro':null, glow:atm && mv.aero && t>0.8}; }};
  }
  // Vom Mondorbit weg (Fluchtbahn nach außen)
  if(fl==='orbit' && M[fb] && tl==='capt'){
    const c=mv.orb||shipOrb(b);
    return {b, finalOrb:null, fade:true, at:t=>({p:orbitPos(b,c,c.u+1.3*t,R_ORB+2.2*t*t), burn:t<0.15?'pro':null})};
  }
  return null;
}

// ---------- Systemansicht in 3D: Planet mit Monden, feste schräge Kamera ----------
const SYS_EL = 35*D2R;
const ringPt=(r,a)=>[r*Math.cos(a),0,-r*Math.sin(a)];
const sysState = p => { if(!S.sys || S.sys.p!==p) S.sys={p, capU:-0.75, lowU:3.7, moonU:0}; return S.sys; };
// Plan eines Manövers in der Systemansicht (nur Winkel, unabhängig vom Maßstab)
function sysPlan(mv){
  const [fb,fl]=mv.from.node.split('.'), [tb,tl]=mv.to.node.split('.'), p=planetOfBody(fb);
  if(planetOfBody(tb)!==p || !moonsOf(p).length) return null;
  const st=sysState(p);
  if(fl==='capt' && M[tb] && tl==='orbit'){ const aArr=moonAngle(tb,mv.d1); return {kind:'toMoon', m:tb, p0:st.capU, aArr, final:{moonU:aArr+Math.PI/2}}; }
  if(M[fb] && fl==='orbit' && tl==='capt'){ const aDep=moonAngle(fb,mv.d0); return {kind:'fromMoon', m:fb, m0:st.moonU, aDep, final:{capU:aDep+Math.PI}}; }
  if(fb===p && fl==='orbit' && tl==='capt') return {kind:'raise', u0:st.lowU, final:{capU:st.lowU+Math.PI}};
  if(fb===p && fl==='capt' && tl==='orbit'){ const aero=!!mv.aero, th=aero?4*TAU+Math.PI:Math.PI; return {kind:'lower', u0:st.capU, aero, th, final:{lowU:st.capU+th}}; }
  return null;
}
function drawSys(p){
  const ms=moonsOf(p), [W,H]=fitCanvas(sc,1.6); if(W<60||H<30) return;
  if(!GL.on) return glNote(sc,sctx,W,H);
  prep(sc,sctx,W,H);
  const g=sctx, v=cssv(), cx=W/2, cy=H/2+6, ce=Math.cos(SYS_EL), se=Math.sin(SYS_EL);
  // three.js zeichnet Planet, Monde und den Saturnring; hier wird in Pixeln gerechnet (Maßstab 1).
  glBegin(sc,W,H,cx,cy,1,SYS_EL); prepBack(sc,W,H);
  const gb = bctx; // verdeckte Teile gehören hinter die Kugel
  const rH=Math.min(W/2-34, (H/2-26)/se), rMax=rH*0.82, Rp=Math.max(13,Math.min(22,W*0.028)), rLow=Rp+11, rMin=rLow+22, rMo=10;
  const lo=Math.log(Math.min(...ms.map(m=>M[m].rv))), hi=Math.log(Math.max(...ms.map(m=>M[m].rv)));
  const rOf=m=> ms.length===1 ? rMax*0.7 : rMin+(rMax-rMin)*(Math.log(M[m].rv)-lo)/(hi-lo);
  const P=q=>{ const y2=q[1]*ce-q[2]*se, z2=q[1]*se+q[2]*ce; return {x:cx+q[0], y:cy-y2, z:z2, hidden:z2<0 && Math.hypot(q[0],y2)<Rp}; };
  const moonW=(m,day)=>ringPt(rOf(m),moonAngle(m,day));
  const [k,l]=here(), mine=homePlanet()===p && !S.transit, st=sysState(p);
  const font=(w,sz)=>g.font=`${w} ${sz}px 'Saira Semi Condensed','Arial Narrow',sans-serif`;
  const back=[], front=[];
  // Bahnen in der 3D-Ebene, in Pixeln samt Tiefe: Planet und Rakete verdecken sie richtig
  const poly=(key,pts,style)=>glPath(key,pts.map(P),style);
  const circle=r=>{ const a=[]; for(let j=0;j<=120;j++) a.push(ringPt(r,j/120*TAU)); return a; };
  poly('hoch',circle(rH),{col:v('--line'),w:1.5,dash:[6,5]});
  ms.forEach(m=>poly('mond:'+m,circle(rOf(m)),{col:v('--orbit'),w:1}));
  poly('niedrig',circle(rLow),{col:v('--line'),w:1.5});

  // Schiffsposition für einen Zustand
  const shipW=(node)=>{ const [b,ll]=node.split('.');
    if(M[b]){ const c=moonW(b,S.day); return ll==='surf' ? [c[0],c[1]+7,c[2]] : vadd(c,ringPt(rMo,st.moonU)); }
    if(b!==p) return null;
    return ll==='capt'?ringPt(rH,st.capU):ll==='orbit'?ringPt(rLow,st.lowU):[0,Rp+5,0]; };
  // Flugbahn eines Manövers: Position zum Anteil t
  let path=null;
  if(mine && S.move && S.move.sys){
    const pl=S.move.sys;
    const hoh=(rp,ra)=>{ const a=(rp+ra)/2, e=(ra-rp)/(ra+rp); return {a,e,r:nu=>a*(1-e*e)/(1+e*Math.cos(nu))}; };
    if(pl.kind==='toMoon'){ const E=hoh(rOf(pl.m),rH), aDep=pl.aArr-Math.PI, da=((aDep-pl.p0)%TAU+TAU)%TAU;
      path=t=>{ if(t<0.25) return {q:ringPt(rH,pl.p0+da*t/0.25)};
        if(t<0.92){ const s=(t-0.25)/0.67, nu=keplerNu(Math.PI+Math.PI*s,E.e); return {q:ringPt(E.r(nu),pl.aArr-TAU+nu), burn:s<0.06?'retro':null}; }
        const s=(t-0.92)/0.08, a=ringPt(rOf(pl.m),pl.aArr), b=vadd(moonW(pl.m,S.move.d1),ringPt(rMo,pl.final.moonU)); return {q:vadd(vmul(a,1-s),vmul(b,s)), burn:'retro'}; }; }
    if(pl.kind==='fromMoon'){ const E=hoh(rOf(pl.m),rH);
      path=t=>{ if(t<0.08){ const s=t/0.08, a=vadd(moonW(pl.m,S.move.d0),ringPt(rMo,pl.m0)), b=ringPt(rOf(pl.m),pl.aDep); return {q:vadd(vmul(a,1-s),vmul(b,s)), burn:'pro'}; }
        const s=(t-0.08)/0.92, nu=keplerNu(Math.PI*s,E.e); return {q:ringPt(E.r(nu),pl.aDep+nu), burn:s>0.95?'pro':null}; }; }
    if(pl.kind==='raise'){ const E=hoh(rLow,rH); path=t=>{ const nu=keplerNu(Math.PI*t,E.e); return {q:ringPt(E.r(nu),pl.u0+nu), burn:(t<0.05||t>0.95)?'pro':null}; }; }
    if(pl.kind==='lower' && !pl.aero){ const E=hoh(rLow,rH); path=t=>{ const nu=keplerNu(Math.PI+Math.PI*t,E.e); return {q:ringPt(E.r(nu),pl.u0+nu-Math.PI), burn:(t<0.05||t>0.95)?'retro':null}; }; }
    if(pl.kind==='lower' && pl.aero){ // Aerobremsen: viele Durchgänge durch die Hochatmosphäre, die Ellipse schrumpft
      path=t=>{ const th=pl.th*t, ra=rH+(rLow-rH)*Math.min(1,t*1.05), rp=rLow*0.97, a=(rp+ra)/2, e=(ra-rp)/(ra+rp), nu=th+Math.PI;
        const r=a*(1-e*e)/(1+e*Math.cos(nu)); return {q:ringPt(r,pl.u0+th), glow:hasAtm(p) && r<rLow*1.08 && t<0.97}; }; }
  }
  let ship=null;
  if(mine && S.node){
    if(path){ const t=moveProg(), c=path(t), a=P(path(Math.max(0,t-0.01)).q), b=P(path(Math.min(1,t+0.01)).q);
      const tr=[]; for(let j=0;j<=120;j++) tr.push(path(j/120).q); poly('spur',tr,{col:v('--accent'),w:1.4,dash:[3,4],a:0.6,ghost:0.4});
      ship={pt:P(c.q), dir:[b.x-a.x,b.y-a.y], burn:c.burn, glow:c.glow, soon:path(Math.min(1,t+0.06)).burn}; }
    else { const w=shipW(S.move?S.move.from.node:S.node); if(w){ const nd=S.node.split('.')[1]; let dir=[1,0];
        if(!S.move && nd!=='surf'){ const [b]=S.node.split('.'); const base=M[b]?moonW(b,S.day):[0,0,0], rr=M[b]?rMo:(nd==='capt'?rH:rLow), uu=M[b]?st.moonU:(nd==='capt'?st.capU:st.lowU);
          const a=P(vadd(base,ringPt(rr,uu-0.05))), c=P(vadd(base,ringPt(rr,uu+0.05))); dir=[c.x-a.x,c.y-a.y]; }
        if(nd==='surf') dir=[0,-1];
        ship={pt:P(w), dir, up:nd==='surf'}; } }
  }
  if(ship){ const s=ship, hid=s.pt.hidden, c=hid?gb:g; (hid?back:front).push(()=>{ const dl=Math.hypot(...s.dir)||1, ux=s.dir[0]/dl, uy=s.dir[1]/dl;
      if(s.glow){ const gr=c.createRadialGradient(s.pt.x,s.pt.y,0,s.pt.x,s.pt.y,12); gr.addColorStop(0,'rgba(255,190,120,0.9)'); gr.addColorStop(1,'rgba(255,120,40,0)'); c.fillStyle=gr; c.beginPath(); c.arc(s.pt.x,s.pt.y,12,0,TAU); c.fill(); }
      // echte Tiefe: der Planet verdeckt die Rakete selbst. Auf einem Mond stehend muss sie davor liegen.
      const va=Math.atan2(-uy,ux), z=s.pt.z+(s.up?RKT_LEN*0.6:0);
      if(s.up) drawRocket(c,'sys',s.pt.x,s.pt.y,va,null,null,{mode:'up',up:Math.PI/2},v('--accent'),z);
      else drawRocket(c,'sys',s.pt.x,s.pt.y,va,s.burn,s.soon,null,v('--accent'),z); }); }

  // Monde als kleine Kugeln, hinten oder vorne
  const drawMoon=(m,w)=>{ const c=P(moonW(m,S.day)), x=c.x, y=c.y, pk={type:'body',body:m}, sel=isPick(pk);
    glPut(m, moonW(m,S.day), 5.5);
    if(hasDepot(m)){ w.fillStyle=v('--good'); w.beginPath(); w.arc(x+7,y-6,2.5,0,TAU); w.fill(); }
    if(cargoTo(kk=>bodyOf(kk)===m).length){ w.strokeStyle=v('--good'); w.lineWidth=1.5; w.setLineDash([3,3]); w.beginPath(); w.arc(x,y,11,0,TAU); w.stroke(); w.setLineDash([]); }
    if(sel){ w.strokeStyle=v('--accent'); w.lineWidth=2; w.beginPath(); w.arc(x,y,15,0,TAU); w.stroke(); }
    font(sel?600:500,12); w.fillStyle=sel?v('--text'):'#c9cee0'; w.textAlign='center'; w.textBaseline='bottom'; w.shadowColor='rgba(0,0,0,0.9)'; w.shadowBlur=3; w.fillText(M[m].name,x,y-12); w.shadowBlur=0;
    HITS.push({canvas:sc,x,y,r:22,pick:pk}); };
  ms.forEach(m=>{ const c=P(moonW(m,S.day)); const hid=c.z<0; (hid?back:front).push(()=>drawMoon(m,hid?gb:g)); });
  // Reihenfolge: hinten, Ringe hinten (Saturn), Planet, vorne
  back.forEach(f=>f());
  glPut(p,null,Rp);
  // Der Ring liegt in der Äquatorebene. Die Zeichnung reicht bis an den Bildrand, deshalb ist die
  // halbe Kantenlänge der äußere Ringradius; innen bleibt sie durchsichtig.
  if(p==='saturn'){ const rg=glSaturnRing(); rg.visible=true; rg.scale.set(Rp*2.24,Rp*2.24,1); }
  const pp={type:'body',body:p};
  if(cargoTo(kk=>bodyOf(kk)===p && kk.node!==p+'.capt' && kk.node!==p+'.orbit').length){ g.strokeStyle=v('--good'); g.lineWidth=1.5; g.setLineDash([3,3]); g.beginPath(); g.arc(cx,cy,Rp+5,0,TAU); g.stroke(); g.setLineDash([]); }
  if(isPick(pp)){ g.strokeStyle=v('--accent'); g.lineWidth=2; g.beginPath(); g.arc(cx,cy,Rp+7,0,TAU); g.stroke(); }
  HITS.push({canvas:sc,x:cx,y:cy,r:Rp+3,pick:pp});
  front.forEach(f=>f());
  // Bahnmarkierungen
  const nodeMark=(q,node,label,align)=>{ const c=P(q), x=c.x, y=c.y, pk={type:'node',node}, sel=isPick(pk), here_=mine&&S.node===node;
    g.fillStyle=v('--bg'); g.strokeStyle=sel?v('--accent'):v('--text'); g.lineWidth=sel?2.5:1.5; g.beginPath(); g.arc(x,y,6,0,TAU); g.fill(); g.stroke();
    if(cargoTo(kk=>kk.node===node).length){ g.strokeStyle=v('--good'); g.lineWidth=1.5; g.setLineDash([3,3]); g.beginPath(); g.arc(x,y,12,0,TAU); g.stroke(); g.setLineDash([]); }
    if(fuelHere(node,null)){ g.fillStyle=v('--good'); g.beginPath(); g.arc(x+6,y-7,3,0,TAU); g.fill(); }
    font(here_||sel?600:500,12); g.fillStyle=sel?v('--text'):'#c9cee0'; g.textAlign=align; g.textBaseline='middle'; g.shadowColor='rgba(0,0,0,0.9)'; g.shadowBlur=3; g.fillText(label,x+(align==='left'?11:-11),y); g.shadowBlur=0;
    HITS.push({canvas:sc,x,y,r:22,pick:pk}); };
  nodeMark(ringPt(rLow,3.7),p+'.orbit','Niedriger Orbit','right');
  nodeMark(ringPt(rH,-0.75),p+'.capt','Hoher Orbit','left');
  glEnd();
}

// Polkappen je Körper: [Breite, Deckkraft]
const CAPS = {earth:[[-68,0.9],[80,0.85]], mars:[[80,0.85]], mercury:[], ceres:[], europa:[], enceladus:[[-70,0.5]]};
function drawBody(b){
  const [W]=fitCanvas(cv,1); if(W<60) return;
  if(!GL.on) return glNote(cv,ctx,W,W);
  prep(cv,ctx,W,W);
  const g=ctx, v=cssv(), cx=W/2, cy=W/2+4, R=W*0.3, cam=makeCam(cx,cy,R,bodyView(b).el);
  // three.js übernimmt die Kugel; dieselbe Kamera, R Pixel je Körperradius
  glBegin(cv,W,W,cx,cy,R,bodyView(b).el); prepBack(cv,W,W);
  const gb = bctx; // verdeckte Teile gehören hinter die Kugel
  glPut(b,null,1);
  const [k,l]=here(), mine=k===b && !S.transit;
  const font=(w,sz)=>g.font=`${w} ${sz}px 'Saira Semi Condensed','Arial Narrow',sans-serif`;

let idleT=0;
function idleLoop(ts){
  requestAnimationFrame(idleLoop);
  if(reduce || !S || S.busy || document.hidden || ts-idleT<40){ if(ts-idleT>=40) idleT=ts; return; }
  const dt=Math.min(0.1,(ts-idleT)/1000); idleT=ts;
  if(!S.node || $('stage').clientWidth<1) return;
  const vw=mapView(), [b,nd]=S.node.split('.');
  // Systemansicht: im niedrigen Orbit, am Mond oder im hohen Orbit weiterkreisen

    const st=sysState(vw.planet); if(M[b]) st.moonU+=dt*1.4; else if(nd==='orbit') st.lowU+=dt*0.5; else st.capU+=dt*0.04;
    HITS=HITS.filter(h=>h.canvas!==sc); drawSys(vw.planet); return; }

function onMapClick(e){

// ---------- Routenplanung ----------
function planRoute(target, mode, start){

  const q=[{n:start.node,s:start.site,c:0,dv:0,days:0}]; best[key(start.node,start.site)]=q[0];
  let goal=null;
  while(q.length){
    q.sort((a,b)=>a.c-b.c); const cur=q.shift(), ck=key(cur.n,cur.s);
    if(done.has(ck)) continue; done.add(ck);
    if(cur.n===target.node && (!target.site || cur.s===target.site)){ goal=cur; break; }
    for(const ed0 of edgesFrom(cur.n,cur.s)){
      const ed={...ed0}, day=start.day+cur.days;
      if(ed.leg){ const [a,b]=ed.leg, t=transfer(a,b,day);
        if(mode==='now'){ ed.dv=t.total; ed.days=t.tof; ed.wait=0; }
        else { const id=idealTransfer(a,b); ed.wait=t.d<0.04?0:t.wait; ed.dv=id.total; ed.days=ed.wait+id.tof; } }
      const nk=key(ed.node,ed.site), dv=cur.dv+ed.dv, days=cur.days+ed.days, c=dv+days*0.01;
      if(!best[nk] || c<best[nk].c){ best[nk]={n:ed.node,s:ed.site,c,dv,days}; prev[nk]={k:ck,from:cur,ed}; q.push(best[nk]); }
    }
  }
  if(!goal) return null;
  const path=[]; let k=key(goal.n,goal.s);
  while(prev[k]){ path.unshift({from:prev[k].from, ed:prev[k].ed}); k=prev[k].k; }
  const steps=[]; let day=start.day, fee=0;
  path.forEach(({from,ed})=>{
    if(ed.wait>0){ steps.push({kind:'wait', leg:ed.leg, dv:0, days:ed.wait, label:`Auf das Fenster ${zuName(ed.leg[1])} warten`, until:day+ed.wait}); day+=ed.wait; }
    const days=ed.days-(ed.wait||0);
    if(ed.launch) fee+=Math.round(LAUNCH_FEE*(eng().dry+cargoMass()+S.fuel)*(ed.hop?HOP_FEE_SHARE:1));
    steps.push({kind:ed.leg?'leg':'move', node:ed.node, site:ed.site, leg:ed.leg, dv:ed.dv, days, label:stepLabel(from,ed)}); day+=days;
  });
  return {steps, dv:goal.dv, days:goal.days, arrive:start.day+goal.days, fee};
}
const zuName = p => (p==='venus'||p==='earth'?'zur ':'zum ')+B[p].name;
function stepLabel(from,e){
  if(e.leg) return `Transfer ${zuName(e.leg[1])}`;
  const [fk,fl]=from.n.split('.'), [tk,tl]=e.node.split('.');
  if(tl==='surf'){ const st=siteOf(tk,e.site); if(fl==='surf') return `${e.launch?'Suborbitaler Flug':'Hüpfer'} nach ${st?st.name:bodyName(tk)}`; return `Landen: ${st?st.name:bodyName(tk)}`; }
  if(fl==='surf') return e.launch?'Mit Trägerrakete in den Orbit':`Aufstieg in den Orbit${M[fk]?' um '+M[fk].name:''}`;
  if(fl==='orbit' && tl==='capt') return 'In den hohen Orbit';
  if(fl==='capt' && tk===fk) return e.dv<100?'Aerobremsen in den niedrigen Orbit':'Abstieg in den niedrigen Orbit';
  if(fl==='capt' && M[tk]) return tk==='moon'?'Zum Mond':`Zum Mond ${M[tk].name}`;
  if(M[fk] && tl==='capt') return `Zurück in den hohen Orbit ${planetGen(tk)}`;
  return targetName({node:e.node});
}
function execStep(st){
  if(!st || S.busy || S.over) return false;
  if(st.kind==='wait'){ const [a,b]=st.leg, t=transfer(a,b,S.day); if(t.d<0.04) return true; waitDays(t.wait); return true; }
  if(st.kind==='leg'){ const hp=homePlanet(); if(S.node!==hp+'.capt' || transfer(hp,st.leg[1],S.day).total>dvAvail()) return false; doTransfer(st.leg[1]); return true; }
  const a=localActions().find(a=>a.to===st.node && (a.site||null)===(st.site||null) && Math.abs(a.dv-st.dv)<1);
  if(!a || a.dv>dvAvail()+0.5 || feeBlocked(a)) return false;
  doAction(a); return true;
}
// Wie viel Δv braucht es von einem Ort bis zur nächsten Tankstelle? 0, wenn es dort eine gibt.
const FUEL_SPOTS = Object.keys(FUEL_PRICE).map(k=>{ const [node,site]=k.split('@'); return {node, site:site||(node==='earth.surf'?'kourou':null)}; });
function fuelHere(node,site){ return (FUEL_PRICE[node+'@'+site] ?? FUEL_PRICE[node])!==undefined; }
function nearestFuel(start){
  if(fuelHere(start.node,start.site)) return {dv:0, spot:null};
  let best={dv:Infinity, spot:null};
  FUEL_SPOTS.forEach(t=>{ const pl=planRoute(t,'eco',start); if(pl && pl.dv<best.dv) best={dv:pl.dv, spot:t}; });
  return best;
}
function stepBlocker(st){
  if(st.kind==='leg'){ const hp=homePlanet(); if(S.node!==hp+'.capt') return 'Transfers starten aus dem hohen Orbit.';
    return `Der Transfer kostet gerade ${km(transfer(hp,st.leg[1],S.day).total)} km/s, du hast ${km(dvAvail())}.`; }
  const a=localActions().find(a=>a.to===st.node && (a.site||null)===(st.site||null));
  if(!a) return 'Dieses Manöver ist von hier nicht möglich.';
  if(a.dv>dvAvail()+0.5) return `Es braucht ${km(a.dv)} km/s, du hast ${km(dvAvail())}.`;
  if(feeBlocked(a)) return `Die Startgebühr von ${fmtCr(a.fee)} würde dich in den Konkurs treiben.`;
  return 'Unbekannter Grund.';
}
function openRoute(target,back){ S.ui.route={target, mode:'eco'}; openView('route',back); }
const kTarget = k => ({node:k.node, site:k.site||null});
function routeLink(k,back){ const b=document.createElement('button'); b.type='button'; b.className='olink';
  b.innerHTML=`${icon('route',15)}Route`; b.title=`Route nach ${kontorLabel(k)} planen`; b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); openRoute(kTarget(k),back); }; return b; }

// ---------- Autopilot ----------
function startAutopilot(){
  const r=S.ui.route; if(!r) return;
  S.ui.auto={target:r.target, mode:r.mode, start:locKey()}; S.ui.pick=null; S.ui.rmsg=true;
  // Desktop: Fahrplan bleibt offen. Mobil: zurück zur Karte, damit man den Flug sieht.
  if(!isDesk()){ S.ui.view='main'; render(); window.scrollTo({top:0}); } else render();
  setTimeout(autoTick,200);
}
// arrived=true: am Ziel oder an einem Lieferkontor angehalten → zurück zur Karte, damit der Standort (Abliefern, Aufträge, Tanken) sichtbar ist
function stopAutopilot(msg,arrived){ S.ui.auto=null; if(!ANIM.active) ANIM.fast=false; if(msg) S.msg=msg;
  if(arrived && S.ui.view==='route'){ S.ui.view='main'; S.ui.back=null; } render(); }
function autoTick(){
  const A=S.ui.auto; if(!A) return;
  if(S.busy){ setTimeout(autoTick,250); return; }
  if(S.over) return stopAutopilot();
  if(atTarget(A.target)) return stopAutopilot(`Autopilot: Ziel erreicht, ${targetName(A.target)}.${deliverables().length?' Fracht kann hier abgeliefert werden.':''}`,true);
  if(locKey()!==A.start && deliverables().length) return stopAutopilot(`Autopilot angehalten: Hier in ${kontorAt().name} kann Fracht abgeliefert werden.`,true);
  const plan=planRoute(A.target,A.mode);
  if(!plan || !plan.steps.length) return stopAutopilot('Autopilot: Keine Route gefunden.');
  const st=plan.steps[0];
  if(st.kind!=='wait' && st.dv>dvAvail()+0.5) return stopAutopilot(`Autopilot angehalten: Für „${st.label}“ brauchst du ${km(st.dv)} km/s, du hast ${km(dvAvail())}. Tanke oder wirf Fracht ab.`);
  if(!execStep(st)) return stopAutopilot(`Autopilot angehalten bei „${st.label}“: ${stepBlocker(st)}`);
  A.start=null; // nach dem ersten Schritt zählt jeder Kontor mit Lieferung als Halt
  setTimeout(autoTick,300);
}
function renderAutobar(){
  const w=$('autobar'); w.innerHTML=''; w.hidden=!S.ui.auto; if(!S.ui.auto) return;
  const plan=planRoute(S.ui.auto.target,S.ui.auto.mode), nx=plan&&plan.steps[0];
  w.innerHTML=`<div><b>Autopilot</b> nach ${esc(targetName(S.ui.auto.target))}${nx?`<br><span class="muted">Jetzt: ${esc(nx.label)}</span>`:''}</div>`;
  w.appendChild(btn('Stopp','',false,()=>stopAutopilot('Autopilot gestoppt.')));
}

// ---------- Fahrplan-Ansicht ----------
function panelRoute(p){
  const R=S.ui.route; if(!R) return openView('main');
  const locked=S.busy||S.over;
  const autoBtn=()=>{ const g=document.createElement('div'); g.className='pfoot'; g.appendChild(btn('Autopilot stoppen','wide',false,()=>stopAutopilot('Autopilot gestoppt.'))); return g; };
  if(!S.node){
    p.appendChild(phead(`Route: ${targetName(R.target)}`, `Unterwegs nach ${B[S.transit.b].name}, Ankunft ${dateStr(S.transit.arr)}.`));
    const h=document.createElement('p'); h.className='hint'; h.textContent='Der Fahrplan wird nach der Ankunft neu berechnet.'; p.appendChild(h);
    if(S.ui.auto) p.appendChild(autoBtn());
    return;
  }
  if(atTarget(R.target)){
    p.appendChild(phead(`Route: ${targetName(R.target)}`, 'Du bist am Ziel.'));
    if(S.ui.rmsg && S.msg){ const m=document.createElement('div'); m.className='msg'; m.style.margin='0 0 12px'; m.textContent=S.msg; p.appendChild(m); }
    const del=deliverables();
    if(del.length){ const f=document.createElement('div'); f.className='pfoot'; f.appendChild(btn(`Abliefern (${del.length}), ${fmtCr(del.reduce((s,o)=>s+payout(o),0))}`,'go wide',locked,()=>{ deliverAll(); })); p.appendChild(f); }
    return;
  }
  const plans={eco:planRoute(R.target,'eco'), now:planRoute(R.target,'now')};
  const plan=plans[R.mode];
  p.appendChild(phead(`Route: ${targetName(R.target)}`, `Von ${esc(nodeName(S.node))}.`));
  if(S.ui.rmsg && S.msg){ const m=document.createElement('div'); m.className='msg'; m.style.margin='0 0 12px'; m.textContent=S.msg; p.appendChild(m); }
  if(!plan){ const e=document.createElement('p'); e.className='hint'; e.textContent='Dorthin gibt es keine Route.'; p.appendChild(e); return; }
  const chips=document.createElement('div'); chips.className='chips';
  [['eco','Sparsam'],['now','Sofort starten']].forEach(([m,t])=>{
    const pl=plans[m], ok=pl && pl.dv<=dvAvail()+0.5;
    const b=btn(`${t}: ${pl?km(pl.dv)+' km/s, '+fmtDays(pl.days):'–'}`, R.mode===m?'chip on':'chip'+(ok?'':' bad'), false, ()=>{ R.mode=m; render(); });
    b.setAttribute('aria-pressed',R.mode===m); chips.appendChild(b);
  });
  p.appendChild(chips);
  const tl=document.createElement('ol'); tl.className='timeline';
  let run=S.day;
  plan.steps.forEach((st,i)=>{
    run+=st.days; const last=i===plan.steps.length-1;
    const li=document.createElement('li'); li.className=st.kind+(i===0?' first':'')+(last?' last':'');
    li.innerHTML=`<span class="dot"></span><div class="tx"><b>${esc(st.label)}</b><small>${st.kind==='wait'?`${fmtDays(st.days)}, bis ${dateStr(run)}`:fmtDays(st.days)}${last?`, Ankunft ${dateStr(run)}`:''}</small></div><span class="num">${st.kind==='wait'?'–':km(st.dv)+' km/s'}</span>`;
    tl.appendChild(li);
  });
  p.appendChild(tl);
  const have=dvAvail(), ok=plan.dv<=have+0.5; R.strand=false;
  const sum=document.createElement('div'); sum.className='pfoot';
  const deadl=cargoOrders().filter(o=>{ const k=KBY[o.to]; return k.node===R.target.node && (!k.site||k.site===R.target.site); });
  const late=deadl.filter(o=>plan.arrive>o.deadline);
  sum.innerHTML=`<div class="row"><span class="muted">Braucht ${km(plan.dv)} von ${km(have)} km/s</span><b class="${ok?'okc':'badc'}">${ok?'Rest '+km(have-plan.dv)+' km/s':'Es fehlen '+km(plan.dv-have)+' km/s'}</b></div>
    <div class="massbar"><i style="width:${Math.min(100,plan.dv/Math.max(have,1)*100).toFixed(0)}%;background:${ok?'var(--accent)':'var(--bad)'}"></i></div>
    <p class="kinfo">${deadl.length?(late.length?`${late.length} ${late.length>1?'Aufträge kommen':'Auftrag kommt'} nach der Frist an.`:`${deadl.length>1?'Alle '+deadl.length+' Aufträge':'Der Auftrag'} für dieses Ziel ${deadl.length>1?'treffen':'trifft'} vor der Frist ein.`):''}${plan.fee?` Startgebühr ${fmtCr(plan.fee)}.`:''} ${ok?'Der Autopilot hält, wenn unterwegs Fracht abgeliefert werden kann.':dvWith(eng().cap,cargoMass())<plan.dv?`Zu schwer beladen: Auch vollgetankt hättest du nur ${km(dvWith(eng().cap,cargoMass()))} km/s. Gib einen Auftrag zurück oder wähle ein anderes Ziel.`:'Tanke vorher oder wähle eine andere Route.'}</p>`;
  if(ok){
    const cm=cargoMass(), m0=eng().dry+cm+S.fuel, fAfter=Math.max(0, m0/Math.exp(plan.dv/(eng().isp*G0))-eng().dry-cm);
    const cmAfter=cm-deadl.reduce((s,o)=>s+o.n*GOODS[o.good].m,0), rest=dvWith(fAfter,cmAfter);
    const nf=nearestFuel({node:R.target.node, site:R.target.site, day:plan.arrive});
    if(nf.dv>rest+0.5){ R.strand=true;
      const w=document.createElement('p'); w.className='o-warn bad';
      w.textContent=`Achtung: Am Ziel gibt es keine Tankstelle. Danach bleiben dir ${km(rest)} km/s, bis zur nächsten Tankstelle brauchst du ${isFinite(nf.dv)?km(nf.dv)+' km/s':'mehr'}. Du würdest stranden.`;
      sum.appendChild(w);
    } else if(nf.dv>0){
      const w=document.createElement('p'); w.className='o-note';
      w.textContent=`Am Ziel gibt es keine Tankstelle. Mit dem Rest von ${km(rest)} km/s erreichst du die nächste (${km(nf.dv)} km/s).`;
      sum.appendChild(w);
    }
  }
  if(!ok && !S.ui.auto){
    // Route zu teuer: den Weg zur nächsten erreichbaren Tankstelle anbieten
    const nf=nearestFuel({node:S.node,site:S.site,day:S.day});
    if(nf.spot && nf.dv>0 && nf.dv<=have+0.5 && !(nf.spot.node===R.target.node && (nf.spot.site||null)===(R.target.site||null))){
      const fb=btn(`Erst zur nächsten Tankstelle: ${targetName(nf.spot)}, ${km(nf.dv)} km/s`,'wide',locked,()=>openRoute(nf.spot,S.ui.back));
      fb.style.fontSize='.92rem'; sum.appendChild(fb);
    }
  }
  // Tanken direkt im Routenplaner, wenn hier eine Tankstelle ist
  const rf=refuelInfo();
  if(rf && rf.need>0.5 && !S.ui.auto){
    const box=document.createElement('div'); box.className='rtank';
    const dvFull=dvWith(S.fuel+rf.max,cargoMass()), full=rf.max>=rf.need-0.05;
    const forRoute=Math.max(0,Math.min(rf.max, fuelFor(plan.dv,cargoMass())*1.03-S.fuel));
    box.innerHTML=`<div class="row"><span class="muted">Tankstelle hier, ${rf.price} Cr/t, dauert ${fmtDays(rf.days)}</span></div>`;
    const tg=document.createElement('div'); tg.className='two';
    if(rf.max<0.1) tg.appendChild(btn('Kein Geld für Treibstoff','span2',true,()=>{}));
    else {
      tg.appendChild(btn(`${full?'Volltanken':'So viel wie bezahlbar'}: ${tons(rf.max)}, ${fmtCr(rf.max*rf.price)} → ${km(dvFull)} km/s`,'',locked,()=>doRefuel(rf.max,true)));
      if(forRoute>0.5 && forRoute<rf.max-0.5) tg.appendChild(btn(`Bis Route reicht: ${tons(forRoute)}, ${fmtCr(forRoute*rf.price)}`,'',locked,()=>doRefuel(forRoute,true)));
      else tg.firstChild.classList.add('span2');
    }
    box.appendChild(tg);
    const more=document.createElement('button'); more.type='button'; more.className='linkbtn'; more.textContent='Andere Menge wählen';
    more.onclick=()=>openView('tanken','route'); box.appendChild(more);
    sum.appendChild(box);
  }
  const g=document.createElement('div'); g.className='two';
  g.appendChild(btn('Nur nächster Schritt','',locked||!!S.ui.auto||!plan.steps.length,()=>{ const st=plan.steps[0]; S.ui.rmsg=true; if(!execStep(st)){ S.msg=`„${st.label}“ ist gerade nicht möglich. ${stepBlocker(st)}`; } render(); }));
  if(S.ui.auto) g.appendChild(btn('Autopilot stoppen','',false,()=>stopAutopilot('Autopilot gestoppt.')));
  else g.appendChild(R.strand ? btn('Trotzdem starten','',locked||!ok,startAutopilot) : btn('Autopilot starten','go',locked||!ok,startAutopilot));
  sum.appendChild(g); p.appendChild(sum);
}

// ---------- Menü, Legende, Schalter ----------
function resetGame(){ S.ui.auto=null; if(S.busy){ S.msg='Bitte kurz warten, das Schiff ist gerade unterwegs.'; render(); return; } try{ localStorage.removeItem(SAVE_KEY); }catch(e){} newGame(); render(); }
function saveSlot(){
  if(S.busy||!S.node){ S.msg='Speichern geht nur, wenn das Schiff steht.'; render(); return; }
  const o={...S, visited:[...S.visited]}; delete o.transit; delete o.ui; delete o.move; delete o.anim;
  memSlot=JSON.stringify(o);
  try{ localStorage.setItem(SLOT_KEY, memSlot); S.msg=`Gespeichert: ${dateStr(S.day)}, ${fmtCr(S.credits)}.`; }
  catch(e){ S.msg=`Gespeichert für diese Sitzung: ${dateStr(S.day)}, ${fmtCr(S.credits)}. Der Browser erlaubt kein dauerhaftes Speichern.`; }
  render();
}
function loadSlot(){
  if(S.busy) return;
  if(!load(SLOT_KEY)){ S.msg='Kein gespeicherter Spielstand gefunden.'; render(); return; }
  S.msg=`Spielstand geladen: ${dateStr(S.day)}, ${fmtCr(S.credits)}.`; render();
}
const menu=$('menu'), menubtn=$('menubtn');
const resetBtn=menu.querySelector('[data-menu="reset"]');
function disarmReset(){ resetBtn.classList.remove('armed'); resetBtn.textContent='Neu starten'; }
function setMenu(open){ menu.hidden=!open; menubtn.setAttribute('aria-expanded',open); if(!open) disarmReset(); }
menubtn.onclick=e=>{ e.stopPropagation(); setMenu(menu.hidden); };
menu.onclick=e=>e.stopPropagation();
document.addEventListener('click',()=>{ setMenu(false); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ setMenu(false); setLegend(false); } });
menu.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{
  const a=b.dataset.menu;
  // Browser-Dialoge (confirm) sind in eingebetteten Seiten oft gesperrt, daher Bestätigung per zweitem Klick
  if(a==='reset' && !b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='Wirklich neu starten? Nochmal tippen'; return; }
  setMenu(false);
  if(a==='fs') toggleFs(); else if(a==='save') saveSlot(); else if(a==='load') loadSlot();
  else if(a==='reset') resetGame();
});
document.querySelectorAll('[data-wait]').forEach(b=>b.onclick=()=>{ setMenu(false); if(S.ui.view!=='main' && !isDesk()) openView('main'); waitDays(+b.dataset.wait); });
const infobtn=$('infobtn');
function setLegend(open){ $('legend').hidden=!open; infobtn.setAttribute('aria-expanded',open); }
infobtn.onclick=e=>{ e.stopPropagation(); setLegend($('legend').hidden); };
$('legend').onclick=()=>setLegend(false);
$('autofill').onclick=()=>{ S.autoFill=!S.autoFill; S.msg=S.autoFill?'Immer volltanken: an. An jeder Tankstelle wird der Tank gefüllt, soweit das Geld reicht.':'Immer volltanken: aus.'; render(); autoFill(); };
$('cargotile').onclick=()=>openView(S.ui.view==='fracht'?'main':'fracht');
$('stage').addEventListener('pointerdown',()=>{ if(ANIM.active && !ANIM.fast){ ANIM.fast=true; speedHint(); } });
window.addEventListener('resize',draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// Vollbild, wo der Browser es erlaubt (iPhone-Safari kann es für Seiten nicht)
const isFs = () => !!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFs(){
  const el=document.documentElement;
  try{
    if(isFs()) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else { const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(r&&r.catch) r.catch(()=>{ S.msg='Vollbild ist hier gesperrt.'; render(); }); }
  }catch(e){ S.msg='Vollbild ist hier gesperrt.'; render(); }
}
(()=>{
  const b=$('fs'), m=$('menufs');
  const can=document.fullscreenEnabled||document.webkitFullscreenEnabled;
  if(!can) return;
  b.hidden=false; m.hidden=false;
  b.onclick=toggleFs;
  const upd=()=>{ const on=isFs(); b.setAttribute('aria-label',on?'Vollbild beenden':'Vollbild'); m.textContent=on?'Vollbild beenden':'Vollbild'; setTimeout(draw,100); };
  document.addEventListener('fullscreenchange',upd); document.addEventListener('webkitfullscreenchange',upd);
})();
if(!load()) newGame();
render();
requestAnimationFrame(idleLoop);
// Kommt das Modul nicht an (kein Netz, blockiertes CDN), bleibt die Karte sonst ewig bei "wird geladen".
setTimeout(()=>{ if(GL.state==='laden') glOff('three.js ließ sich nicht laden.'); }, 10000);
</script>

     Das Modul läuft nach dem Hauptskript. Fehlt das Netz oder WebGL, bleibt es bei 2D. -->
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
try{ glInit(THREE); }catch(e){ glOff(e && e.message || String(e)); }
</script>
