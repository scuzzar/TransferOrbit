<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10162b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Transferfenster – Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Immer dunkel, wie in den Mockups */
  color-scheme: dark;
  --bg:#10162b; --panel:#171f3b; --line:#2b3662; --text:#e7e9f2; --muted:#9aa2c2;
  --accent:#f2b33d; --accent-ink:#1a1400; --good:#5cc9a0; --warn:#e6c14b; --bad:#ec7a7e;
  --orbit:#27315a; --sun:#f5b544;
}
*{box-sizing:border-box}
.topr{display:flex;align-items:center;gap:10px}
.fsbtn{min-height:40px;min-width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
main{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Saira Semi Condensed','Arial Narrow',system-ui,sans-serif;font-size:16px;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:14px 14px 48px}
h1{font-size:1.75rem;font-weight:700;margin:0;letter-spacing:.01em;line-height:1.1}
h2{font-size:1.05rem;font-weight:600;margin:22px 0 8px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.date{color:var(--muted);text-align:right;font-size:.95rem;white-space:nowrap}
@media (max-width:899px){ h1{font-size:1.45rem} }
.date b{color:var(--text);font-weight:600;display:block;font-size:1.05rem}
.stats{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.dvnum{font-size:2.1rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.dvnum small{font-size:1rem;font-weight:500;color:var(--muted)}
.gauge{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sub{color:var(--muted);font-size:.9rem;grid-column:1/-1}
.stage{position:relative;margin-top:12px}
canvas{display:block;width:100%;aspect-ratio:1/1;touch-action:manipulation}
#sys{aspect-ratio:1.6/1}
canvas[hidden]{display:none!important}
/* Stapel: 2D hinten (#cvb), three.js in der Mitte (#glc), 2D vorne (#cv/#sys).
   Die vorderen Canvas bleiben im Fluss und geben der Bühne ihre Höhe. */
#cvb,#glc{position:absolute;top:0;left:0;width:auto;aspect-ratio:auto;pointer-events:none}
/* Die Bühne zentriert ihr Kind, deshalb setzt der Zeichencode top/left auf die Lage von #cv bzw. #sys. */
#cv,#sys{position:relative}
.maptabs{display:flex;align-items:center;gap:6px;margin:12px 0 6px}
.maptabs button{min-height:36px;padding:4px 12px;font-size:.9rem;font-weight:600;color:var(--muted)}
.maptabs button[aria-selected="true"]{color:var(--text);border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.maptabs .auto{margin-left:auto;font-size:.8rem;color:var(--muted)}
.maptabs button.linky{border:none;padding:4px 0;min-height:32px;font-size:.8rem;font-weight:500;color:var(--accent);text-decoration:underline;box-shadow:none}
.legend{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.msg{margin-top:12px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--panel);font-size:.95rem}
/* Streckenplan */
.line{display:flex;flex-wrap:wrap;row-gap:12px;align-items:flex-start;padding:6px 2px 2px}
.sys{display:flex;align-items:flex-start;flex:0 0 auto}
.sys + .sys{margin-left:6px}
.st{position:relative;flex:0 0 auto;width:78px;text-align:center;font-size:.8rem;color:var(--muted)}
.st::before{content:"";position:absolute;top:9px;left:0;right:0;height:4px;background:var(--line)}
.st:first-child::before{left:50%}
.st:last-child::before{right:50%}
.st span{position:relative;display:block;width:22px;height:22px;margin:0 auto 4px;border-radius:50%;
  border:3px solid var(--line);background:var(--bg)}
.st.here{color:var(--text);font-weight:600}
.st.here span{background:var(--accent);border-color:var(--accent)}
.sysname{font-size:.8rem;font-weight:600;color:var(--text);padding:0 4px;margin-bottom:2px}
/* Aktionen */
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.act .t{flex:1;min-width:0}
.lat{width:28px;height:28px;flex:0 0 auto}
.lat circle,.lat line{fill:none;stroke:var(--muted);stroke-width:1.2}
.lat line{stroke-dasharray:2 2}
.lat circle.p{fill:var(--accent);stroke:none}
.act .t b{font-weight:600;display:block}
.act .t small{color:var(--muted)}
.act .c{font-variant-numeric:tabular-nums;text-align:right;font-size:.9rem;white-space:nowrap}
button{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--text);
  padding:6px 12px;cursor:pointer;min-height:36px}
button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,.tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 8px}
.tr{padding:9px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.tr.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.tr-top{display:flex;align-items:baseline;gap:8px}
.tr-top b{font-weight:600;flex:1}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto;transform:translateY(-1px)}
.num{font-variant-numeric:tabular-nums;font-size:.92rem}
.num.short{color:var(--bad)}
.tr-bot{display:flex;align-items:center;gap:8px;margin-top:6px}
.win{flex:1;font-size:.88rem}
.win.good{color:var(--good)} .win.ok{color:var(--warn)} .win.bad{color:var(--muted)}
.wait{display:flex;gap:6px;flex-wrap:wrap}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;color:var(--muted);font-size:.85rem;gap:10px}
/* Layout: mobil eine Spalte (Kacheln, Karte, Standort); Desktop: Karte links über volle Höhe, rechts schmale Spalte */
.layout{display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:stretch;margin-top:0}
.stats .card{display:flex;flex-direction:column;gap:2px}
.stats .muted{font-size:.8rem}
.chead{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.cardbtn{font:inherit;font-weight:400;text-align:left;color:var(--text);cursor:pointer;min-height:0;padding:8px 10px}
.cardbtn:hover{border-color:var(--accent)}
.tchip{min-height:24px;padding:0 8px;font-size:.72rem;border-radius:12px;color:var(--muted);line-height:1}
.tchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.maptabs{margin:0}
.maptabs .date{margin-left:8px;font-size:.8rem;line-height:1.15;flex:0 0 auto}
.maptabs .crumbs{flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.maptabs .crumbs::-webkit-scrollbar{display:none}
@media (max-width:899px){
  .maptabs{gap:2px}
  .maptabs .crumbs button{font-size:.85rem;padding:4px 3px}
  .maptabs .date #mday, .maptabs span.auto:not(:has(button)){display:none!important}
  .toast{font-size:.8rem;padding:5px 8px}
  .pbtns{gap:5px}
  .pbtns button{font-size:.82rem;padding:4px 6px;gap:4px}
  .pbtns svg{width:16px;height:16px}
  .stats .card{padding:7px 9px}
  .stat{font-size:1.15rem}
}
.maptabs .date b{font-size:.9rem}
.iconbtn{min-height:36px;min-width:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border-color:transparent}
.iconbtn:hover{color:var(--text)}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:40px;z-index:20;min-width:250px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.menu[hidden]{display:none}
.menu>button{border:none;text-align:left;min-height:40px;padding:6px 10px}
.menu>button:hover{background:rgba(255,255,255,.05)}
.menu .mdanger{color:var(--bad)}
.menu .mdanger.armed{background:var(--bad);color:#1a0808;border-radius:6px}
.msep{height:1px;background:var(--line);margin:4px 2px}
.mlabel{font-size:.8rem;color:var(--muted);padding:2px 10px}
.mwait{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:2px 4px 4px}
.mwait button{min-height:36px;padding:0 2px;font-size:.8rem;white-space:nowrap}
.mfoot{font-size:.78rem;color:var(--muted);padding:4px 10px 2px}
.stage{position:relative;margin-top:4px;display:flex;justify-content:center;align-items:center}
.infobtn{position:absolute;right:6px;bottom:6px;width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;font-weight:700;font-style:italic;font-family:Georgia,serif;color:var(--muted);background:rgba(16,22,43,.75)}
.infobtn[aria-expanded="true"]{color:var(--accent);border-color:var(--accent)}
.legendpop{position:absolute;right:6px;bottom:44px;max-width:min(320px,calc(100% - 12px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;color:var(--muted);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.legendpop[hidden]{display:none}
.toast{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 56px);background:rgba(23,31,59,.94);border-left:3px solid var(--accent);border-radius:4px;padding:7px 10px;font-size:.88rem;pointer-events:none;transition:opacity .4s}
.toast[hidden]{display:none}
.speedhint{position:absolute;right:6px;top:6px;font-size:.78rem;color:var(--muted);background:rgba(16,22,43,.75);border:1px solid var(--line);border-radius:12px;padding:2px 9px;pointer-events:none}
.speedhint.on{color:var(--accent);border-color:var(--accent)}
.speedhint[hidden]{display:none}
.toast.fade{opacity:0}
.col-side{display:flex;flex-direction:column;gap:10px;min-width:0}
#mainview{display:flex;flex-direction:column;gap:10px}
#mainview:empty,#rescue:empty,#pickcard:empty{display:none}
#mainview[hidden]{display:none}
.rescue{margin-top:0}
.pick{margin-top:0}
/* Standort, kompakt */
.place{margin-top:0;padding:10px 12px;gap:8px}
.phdr{display:flex;flex-wrap:wrap;align-items:flex-start;gap:2px 12px}
.phdr .pname{flex:0 1 auto;min-width:0}
.phdr .pname b{font-size:1.05rem;font-weight:700;display:block;line-height:1.2}
.phdr .kinfo{flex:1 1 180px;font-size:.85rem;margin:0;line-height:1.3}
.phdr .tag{margin-left:auto;align-self:flex-start}
.pbtns{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.pbtns button{min-width:0;overflow:hidden;text-overflow:ellipsis;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:4px 8px;font-size:.88rem;white-space:nowrap}
.pbtns button.full{flex-basis:100%}
.pbtns svg{flex:0 0 auto}
.pbtns button span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.olink{border:none;background:none;padding:0 2px;min-height:28px;color:var(--accent);font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.olink:hover{text-decoration:underline}
.rtank{display:flex;flex-direction:column;gap:6px;padding:8px 0 2px;border-top:1px solid var(--line)}
.rtank .two button{font-size:.88rem;line-height:1.2;padding:6px 8px}
.rtank .linkbtn{font-size:.85rem;min-height:28px}
.og-head .row{align-items:flex-start}
@media (min-width: 900px){
  main{max-width:1500px;padding:12px 20px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"map stats" "map side";gap:10px 24px;height:calc(100vh - 24px);height:calc(100dvh - 24px)}
  .stats{grid-area:stats}
  .col-map{grid-area:map;display:flex;flex-direction:column;min-height:0}
  .stage{flex:1 1 auto;min-height:0}
  .col-side{grid-area:side;min-height:0;overflow-y:auto;padding-bottom:4px}
  .pfoot{position:sticky;bottom:0}
}
h3{font-size:.98rem;font-weight:600;margin:14px 0 6px}
.money{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:2px}
.money b{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.money b.neg{color:var(--bad)}
.money span{color:var(--muted);font-size:.9rem}
.kontor h2 .tag,.tag{font-size:.75rem;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid var(--accent);color:var(--accent);vertical-align:middle}
.kinfo{color:var(--muted);font-size:.9rem;margin:0 0 6px}
.needs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;margin-bottom:6px}
.need{display:inline-flex;align-items:center;gap:6px}
.gchip{width:10px;height:10px;border-radius:2px;display:inline-block;flex:0 0 auto}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line)}
.dots i.on{background:var(--good);border-color:var(--good)}
.order{padding:9px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.o-top{display:flex;align-items:baseline;gap:8px}
.o-top b{flex:1;font-weight:600}
.o-top .gchip{transform:translateY(-1px)}
.o-meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:.85rem;margin-top:3px}
.o-meta .late{color:var(--bad)}
.o-warn{font-size:.85rem;color:var(--warn);margin-top:4px}
.o-warn.bad{color:var(--bad)}
.o-note{font-size:.85rem;color:var(--muted);margin-top:4px}
.o-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:4px;margin-bottom:6px}
.slots i{height:22px;border-radius:4px}
.slots i.free{border:1.5px dashed var(--line)}
.rescue{margin-top:10px;padding:10px 12px;border:1px solid var(--bad);border-radius:8px;background:var(--panel)}
.rescue p{margin:0 0 8px;font-size:.95rem}
.muted{color:var(--muted)} .small{font-size:.8rem} .acc{color:var(--accent)} .big{font-size:1.15rem;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stats3 .muted{font-size:.8rem}
.stat{display:block;font-size:1.3rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{font-size:.75rem;font-weight:500;color:var(--muted)}
.stat.neg{color:var(--bad)}
.stats3 .gauge{height:5px;margin-top:5px}
.mslots{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 3px}
.mslots i{flex:1 0 10px;max-width:22px;height:11px;border-radius:3px;border:1.5px solid var(--line)}
.mslots i[style]{border-color:transparent}
#shipinfo{margin-top:6px}
.place{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.place .kinfo{margin:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.two button{min-height:44px}
.span2{grid-column:1/-1}
button.wide{width:100%;min-height:48px;font-size:1rem}
.phead{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;border:none;padding:6px 4px;color:var(--muted);min-height:44px}
.ptitle{font-size:1.5rem;font-weight:700;margin:0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1.5px solid var(--good);border-radius:8px;margin-bottom:8px}
label.order{display:block;cursor:pointer}
.order.pick input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:0 0 auto;align-self:center}
.order.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.order.dis{opacity:.6;cursor:not-allowed}
.needgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;font-size:.9rem}
.needgrid .card{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pfoot{position:sticky;bottom:0;margin:14px -14px -48px;padding:12px 14px 18px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pfoot .dvrow{justify-content:flex-start}
.bigslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.bigslots div{height:56px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;color:#10162b;text-align:center;padding:2px;line-height:1.15}
.bigslots div b{font-weight:600}
.bigslots .free{border:1.5px dashed var(--line);color:var(--muted)}
.massbox{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.massbox p{margin:4px 0 0}
.massbar{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--line)}
.legendrow{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)}
.legendrow i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.linkbtn{align-self:flex-start;border:none;padding:4px 0;color:var(--accent);text-decoration:underline;min-height:32px}
.frist{margin-top:6px;font-size:.85rem;color:var(--muted)}
.frist .ok{color:var(--good)} .frist .late{color:var(--bad)}
.fbar{height:5px;border-radius:3px;background:var(--line);margin-top:3px;overflow:hidden}
.fbar i{display:block;height:100%}
.tankbox{display:flex;flex-direction:column;gap:8px}
.tankbox .big{font-size:1.5rem}
.tankbox input[type=range]{width:100%;height:32px;accent-color:var(--accent);margin:0}
.cmp{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{display:flex;flex-direction:column}
.cmp b{font-size:1.4rem}
.cmp p{grid-column:1/-1;margin:0;font-size:.92rem}
.pricelist div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.pricelist .me{font-weight:600}
.shipcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.shipcard.mine{opacity:.85}
.shipcard .r{text-align:right}
.stats3s{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:.85rem}
.stats3s>div{display:flex;flex-direction:column}
.stats3s b{font-size:1.05rem}
.up{color:var(--good)} .down{color:var(--bad)}
.mtags{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.mtag{font-size:.75rem;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mtag.deliver{background:var(--good);border-color:var(--good);color:#0c1a14}
.mtag.toward{border-color:var(--good);color:var(--good)}
.mtag.kontor{border-color:var(--accent);color:var(--accent)}
.act.hot{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.tr-top .mtag{margin-left:6px;vertical-align:1px}
@media (max-width:899px){ body.panel-open .col-map, body.panel-open .stats{display:none} }
@media (min-width:900px){ .pfoot{margin:14px 0 0;border:1px solid var(--line);border-radius:10px} }

.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;min-width:0}

<script>
// ---------- Konstanten ----------
const AU = 1.495978707e8, MU_SUN = 1.32712440018e11, G0 = 9.80665;

const SITES = {

const siteOf = (body,id) => (SITES[body]||[]).find(x=>x.id===id);
const hasDepot = body => (SITES[body]||[]).some(x=>x.depot);
const rotPenalty = (body,lat) => (ROT[body]||0)*(1-Math.cos(lat*Math.PI/180)); // m/s
const hasAtm = body => B[body] ? B[body].atm : body==='titan';
const latStr = lat => `${Math.abs(lat).toLocaleString('de-DE',{maximumFractionDigits:1})}° ${lat>=0?'N':'S'}`;
const LVL = {surf:'Oberfläche', orbit:'Niedriger Orbit', capt:'Hoher Orbit'};

// ---------- Ballistische Hüpfer zwischen Landeplätzen desselben Körpers ----------
// Kreisbahngeschwindigkeit an der Oberfläche in m/s (Monde: Näherungswerte)
const VSURF = {mercury:3005, venus:7326, earth:7910, mars:3555, ceres:365, moon:1680, phobos:8, deimos:4,
  io:1810, europa:1430, ganymede:1950, callisto:1730, enceladus:170, titan:1870};
const bodyUp = b => M[b] ? M[b].up : B[b].surf.up;
const bodyDown = b => M[b] ? M[b].down : B[b].surf.down;
// Zentriwinkel zwischen zwei Landeplätzen (Großkreis)
function siteAngle(b,s1,s2){
  const a=siteOf(b,s1), c=siteOf(b,s2); if(!a||!c) return Math.PI;
  const r=Math.PI/180, f1=a.lat*r, f2=c.lat*r, dl=((a.lon||0)-(c.lon||0))*r;
  return Math.acos(Math.max(-1,Math.min(1,Math.sin(f1)*Math.sin(f2)+Math.cos(f1)*Math.cos(f2)*Math.cos(dl))));
}
// Energieärmste ballistische Bahn über den Zentriwinkel th: v² = vs² · 2 sin(th/2) / (1 + sin(th/2)).
// Ohne Atmosphäre: Abheben und Abbremsen kosten je v. Mit Atmosphäre: Verluste beim Start wie beim Aufstieg anteilig,
// dafür bremst die Luft bei der Landung mit. Auf der Erde übernimmt eine kleine Trägerrakete den Hüpfer.
function hopCost(b,s1,s2){
  const th=siteAngle(b,s1,s2), vs=VSURF[b]||1000, x=Math.sin(th/2);
  const v=vs*Math.sqrt(2*x/(1+x)), f=v/vs;
  const full=bodyUp(b)+bodyDown(b);
  let dv;
  if(!hasAtm(b)) dv=2*v*1.03;
  else if(B[b]&&B[b].surf&&B[b].surf.launcher) dv=bodyDown(b);
  else dv=v+Math.max(0,bodyUp(b)-vs)*f+bodyDown(b)*f;
  dv=Math.min(dv, 0.9*full);
  const days=Math.max(0.05, th/Math.PI*0.25);
  return {dv, days, th, launcher:!!(B[b]&&B[b].surf&&B[b].surf.launcher)};
}
const HOP_FEE_SHARE = 0.4; // Anteil der Startgebühr für einen suborbitalen Flug auf der Erde

// ---------- Physik (abstrahiert) ----------
const TAU = Math.PI*2;
const wrap = a => { a = (a+Math.PI) % TAU; if (a<0) a += TAU; return a-Math.PI; };
const theta = (k,day) => B[k].L0*Math.PI/180 + TAU*day/B[k].T;
const nn = k => TAU/B[k].T;
const vc = k => Math.sqrt(B[k].mu/(B[k].R+B[k].alt));   // km/s
const vesc = k => Math.SQRT2*vc(k);
const captDv = k => (0.98*vesc(k)-vc(k))*1000;            // hoher ↔ niedriger Orbit, m/s
const hyp = (k,vinf) => (Math.sqrt(vinf*vinf+vesc(k)**2)-0.98*vesc(k))*1000; // Brennen am Periapsis (Oberth)

function transfer(a,b,day){
  const r1=B[a].a*AU, r2=B[b].a*AU, at=(r1+r2)/2;
  const v1=Math.sqrt(MU_SUN/r1), v2=Math.sqrt(MU_SUN/r2);
  const vp=Math.sqrt(MU_SUN*(2/r1-1/at)), va=Math.sqrt(MU_SUN*(2/r2-1/at));
  const vi1=Math.abs(vp-v1), vi2=Math.abs(v2-va);
  const tH=Math.PI*Math.sqrt(at**3/MU_SUN)/86400;
  const phiStar=wrap(Math.PI-nn(b)*tH);                 // idealer Phasenwinkel
  const phi=wrap(theta(b,day)-theta(a,day));             // aktueller Phasenwinkel
  const d=Math.abs(wrap(phi-phiStar))/Math.PI;           // 0 = perfekt, 1 = maximal daneben
  const f=1+2.2*Math.pow(d,1.5);                         // Strafe auf Überschussgeschwindigkeit
  const dep=hyp(a,vi1*f), arr=hyp(b,vi2*f);
  const tof=tH*(1-0.3*d);
  const rel=nn(b)-nn(a), syn=TAU/Math.abs(rel);
  let w=wrap(phiStar-phi)/rel; w=((w%syn)+syn)%syn;
  return {dep,arr,total:dep+arr,tof,d,wait:w,phiStar};
}

const KBY = Object.fromEntries(KONTORE.map(k=>[k.id,k]));
const HUBS = {werft:KBY.werft, pavonis:KBY.pavonis, valhalla:KBY.valhalla};
const REGION = {earth:'werft',moon:'werft',mercury:'werft',venus:'werft',
  mars:'pavonis',phobos:'pavonis',deimos:'pavonis',ceres:'pavonis',
  jupiter:'valhalla',io:'valhalla',europa:'valhalla',ganymede:'valhalla',callisto:'valhalla',
  saturn:'valhalla',enceladus:'valhalla',titan:'valhalla'};
const HUB_CAP = 40, MAX_OPEN = 6, MAX_ROUTE_DV = 12000; // längere Routen schafft kein Schiff
// Treibstoffpreise in Credits pro t, Schlüssel: Knoten oder Knoten@Landeplatz
const FUEL_PRICE = {'earth.orbit':300,'mars.orbit':220,'earth.surf':250,'mercury.surf@prokofiev':200,'moon.surf@shackleton':150,
  'mars.surf@utopia':150,'mars.surf@pavonis':180,'mars.surf@nordpol':120,'ceres.surf@occator':120,'titan.surf@kraken':110,'ceres.surf@nordpol':100,
  'ganymede.surf@uruk':100,'europa.surf@conamara':90,'callisto.surf@valhalla':90,'enceladus.surf@tigerstreifen':80};
const LAUNCH_FEE = 100, RESCUE_BASE = 5000, RESCUE_PER_T = 300, BANKRUPT = -50000;
const K_T = 400, M_S = 8, V_E = 450*9.80665, K_Z = 15;
const K_ZT = 4;          // Zeitanteil: Cr pro Tonne (Fracht + Schiffsanteil) und Reisetag
const BULK = {min:7, max:18, slow:1.5, premium:1.1, life:180}; // Großaufträge: Größe, Nachschub langsamer als Einzelware, Aufschlag, Laufzeit

const bodyOf = k => k.node.split('.')[0];
const planetOfBody = b => M[b] ? M[b].parent : b;
const bodyName = b => M[b] ? M[b].name : B[b].name;
const kontorPlace = k => k.node==='earth.orbit' ? 'Erdorbit' : k.node.endsWith('.capt') ? `hoher ${B[bodyOf(k)].name}orbit` : bodyName(bodyOf(k));
const kontorLabel = k => k.id==='erde' ? 'Erde' : `${k.name}, ${kontorPlace(k)}`;
const fmtCr = n => `${Math.round(n).toLocaleString('de-DE')} Cr`;
const randInt = (a,b) => a+Math.floor(Math.random()*(b-a+1));

// ---------- Schiff ----------
let S;
const eng = () => SHIPS[S.ship];
const cargoOrders = () => S.eco.orders.filter(o=>o.state==='aboard');
const cargoMass = () => cargoOrders().reduce((s,o)=>s+o.n*GOODS[o.good].m,0);
const slotsUsed = () => cargoOrders().reduce((s,o)=>s+o.n,0);
const dvWith = (f,cm) => eng().isp*G0*Math.log((eng().dry+cm+f)/(eng().dry+cm));
const dvOf = f => dvWith(f,cargoMass());
const dvAvail = () => dvOf(S.fuel);
function burn(dv){
  const cm=cargoMass(), m=(eng().dry+cm+S.fuel)/Math.exp(dv/(eng().isp*G0));
  S.fuel=Math.max(0,m-eng().dry-cm); S.used+=dv;
}
const locKey = () => S.node ? S.node+(S.site?'@'+S.site:'') : null;
const kontorAt = () => S.node ? KONTORE.find(k=>k.node===S.node && (!k.site || k.site===S.site)) : null;
const fuelPrice = () => S.node ? (FUEL_PRICE[locKey()] ?? FUEL_PRICE[S.node]) : undefined;

// ---------- Routensuche für Belohnungen ----------
const idealCache = {};
function idealTransfer(a,b){
  const key=a+'>'+b; if(idealCache[key]) return idealCache[key];
  const t0=transfer(a,b,START_DAY), t=transfer(a,b,START_DAY+t0.wait);
  return idealCache[key]={total:t.total, tof:t.tof};
}
function edgesFrom(node,site){
  const [k,l]=node.split('.'); const E=[];
  const e=(n,s,dv,days,x={})=>E.push({node:n,site:s||null,dv,days,...x});
  const lat=(body,s)=>{const st=siteOf(body,s); return st?st.lat:0;};
  const lands=(body,down)=>(SITES[body]||[]).forEach(st=>e(body+'.surf',st.id,down+(hasAtm(body)?0:rotPenalty(body,st.lat)),0.2));
  if(l==='surf' && site) (SITES[k]||[]).forEach(st=>{ if(st.id===site) return; const h=hopCost(k,site,st.id); e(k+'.surf',st.id,h.dv,h.days,{hop:true,launch:h.launcher}); });
  if(M[k]){
    const m=M[k];
    if(l==='surf') e(k+'.orbit',null,m.up+rotPenalty(k,lat(k,site)),0.2);
    else { lands(k,m.down); e(m.parent+'.capt',null,m.xfer,m.days); }
  } else {
    const b=B[k];
    if(l==='surf'){ const pen=rotPenalty(k,lat(k,site)); e(k+'.orbit',null,b.surf.launcher?pen:b.surf.up+pen,b.surf.launcher?1:0.2,{launch:!!b.surf.launcher}); }
    if(l==='orbit'){ if(b.surf) lands(k,b.surf.down); e(k+'.capt',null,captDv(k),1); }
    if(l==='capt'){
      e(k+'.orbit',null,captDv(k),1); if(b.atm) e(k+'.orbit',null,60,40);
      moonsOf(k).forEach(m=>e(m+'.orbit',null,M[m].xfer,M[m].days));
      PLANETS.filter(p=>p!==k).forEach(p=>{const t=idealTransfer(k,p); e(p+'.capt',null,t.total,t.tof,{leg:[k,p]});});
    }
  }
  return E;
}
const routeCache = {};
function route(from,to){
  const key=from.id+'>'+to.id; if(routeCache[key]) return routeCache[key];
  const startSite = from.site || (from.node==='earth.surf' ? 'kourou' : null);
  const sk=(n,s)=>n+'|'+(s||'');
  const dist={}, prev={}, done=new Set();
  const q=[{n:from.node,s:startSite,c:0}]; dist[sk(from.node,startSite)]={c:0,dv:0,days:0};
  let goal=null;
  while(q.length){
    q.sort((a,b)=>a.c-b.c); const cur=q.shift(), ck=sk(cur.n,cur.s);
    if(done.has(ck)) continue; done.add(ck);
    if(cur.n===to.node && (!to.site || cur.s===to.site)){ goal=ck; break; }
    for(const ed of edgesFrom(cur.n,cur.s)){
      const nk=sk(ed.node,ed.site), d=dist[ck];
      const c=d.dv+ed.dv + (d.days+ed.days)*0.01;
      if(!dist[nk] || c<dist[nk].c){ dist[nk]={c,dv:d.dv+ed.dv,days:d.days+ed.days}; prev[nk]={k:ck,ed}; q.push({n:ed.node,s:ed.site,c}); }
    }
  }
  if(!goal) return routeCache[key]={dv:Infinity,days:0,legs:[],launch:false};
  const legs=[]; let launch=false, k=goal, first=null;
  while(prev[k]){ if(prev[k].ed.leg) legs.unshift(prev[k].ed.leg); if(prev[k].ed.launch && !prev[k].ed.hop) launch=true; first=prev[k].ed; k=prev[k].k; }
  return routeCache[key]={dv:dist[goal].dv, days:dist[goal].days, legs, launch, first};
}
function rewardFor(r,good,n){
  const G=GOODS[good], mass=M_S+n*G.m;
  let R = K_T*mass*(Math.exp(r.dv/V_E)-1) + K_Z*r.days + K_ZT*mass*r.days + 0.1*n*G.w;
  if(r.launch) R += LAUNCH_FEE*(mass+20); // Anteil an der Erdstartgebühr
  return Math.round(R*rewardLuck()/10)*10;
}
// Zufallsfaktor: meist 0,9–1,2; selten (8 %) 1,4–1,9, hohe Werte seltener als niedrige
const LUCK = {p:0.08, min:1.4, max:1.9};
const rewardLuck = () => Math.random()<LUCK.p ? LUCK.min+(LUCK.max-LUCK.min)*Math.random()**2 : 0.9+Math.random()*0.3;
const lateFactor = (o,day) => day<=o.deadline ? 1 : Math.max(0.25, 1-0.02*(day-o.deadline));
const payout = o => Math.round(o.reward*lateFactor(o,S.day));

// ---------- Wirtschaft: Zustand und Tick ----------
function newEconomy(){
  const eco={stock:{}, fwd:{}, demand:{}, orders:[], nextId:1, day:START_DAY-30};
  KONTORE.forEach(k=>{
    eco.stock[k.id]={}; k.makes.forEach(g=>eco.stock[k.id][g]=GOODS[g].lot[1]+Math.random()*2);
    eco.demand[k.id]={}; k.needs.forEach(g=>eco.demand[k.id][g]=2);
    // Drehkreuze starten mit etwas Umschlagware, damit es von Anfang an kurze Aufträge in der Region gibt
    if(k.hub){ eco.fwd[k.id]={water:3, food:3, mach:3, hab:1}; }
  });
  return eco;
}
const openCount = (k,g) => S.eco.orders.filter(o=>o.from===k.id && o.good===g && o.state==='open').length;
function hubRoom(h){
  const stored=Object.values(S.eco.fwd[h.id]).reduce((a,b)=>a+b,0);
  const incoming=S.eco.orders.filter(o=>o.to===h.id).reduce((a,o)=>a+o.n,0);
  return HUB_CAP-stored-incoming;
}
function pickWeighted(list,w){
  const tot=list.reduce((s,x)=>s+w(x),0); let r=Math.random()*tot;
  for(const x of list){ r-=w(x); if(r<=0) return x; } return list[list.length-1];
}
function makeOrder(k,g,fwd,day){
  const eco=S.eco, G=GOODS[g], store=fwd?eco.fwd[k.id]:eco.stock[k.id], have=store[g]||0;
  if(have<G.lot[0] || openCount(k,g)>=MAX_OPEN) return;
  const cand = KONTORE.filter(c=>c.id!==k.id && c.needs.includes(g) && eco.demand[c.id][g]>0 &&
    (fwd ? REGION[bodyOf(c)]===k.hub : bodyOf(c)!==bodyOf(k)) && route(k,c).dv<=MAX_ROUTE_DV);
  if(!cand.length) return;
  const n=randInt(G.lot[0], Math.min(G.lot[1], Math.floor(have)));
  let to=pickWeighted(cand,c=>eco.demand[c.id][g]), transship=false;
  if(!fwd){
    const reg=REGION[bodyOf(to)];
    if(reg!==REGION[bodyOf(k)] && Math.random()<0.6){
      const h=HUBS[reg];
      if(h.id!==k.id && bodyOf(h)!==bodyOf(k) && hubRoom(h)>=n){ to=h; transship=true; }
    }
  }
  const r=route(k,to); if(!isFinite(r.dv)) return;
  if(!transship) eco.demand[to.id][g]--;
  const wait=legWait(r,day);
  store[g]=have-n;
  eco.orders.push({id:eco.nextId++, good:g, n, from:k.id, to:to.id, reward:rewardFor(r,g,n),
    dv:r.dv, days:r.days, deadline:day+wait+1.5*r.days+30, created:day, expires:day+90, state:'open', fwdOrder:fwd, transship});
}
// Wartezeit bis zum Fenster der ersten interplanetaren Etappe einer Route
function legWait(r,day){ if(!r.legs.length) return 0; const [a,b]=r.legs[0], t=transfer(a,b,day); return t.d<0.04?0:t.wait; }
// Frist, wenn der Auftrag am Tag 'day' angenommen wird
function freshDeadline(o,day){ const r=route(KBY[o.from],KBY[o.to]); return day+legWait(r,day)+1.5*o.days+30; }
function econTick(day){
  const eco=S.eco;
  KONTORE.forEach(k=>k.makes.forEach(g=>{ eco.stock[k.id][g]=Math.min(12,(eco.stock[k.id][g]||0)+1/GOODS[g].rate); }));
  if(Math.round(day-START_DAY)%60===0) KONTORE.forEach(k=>k.needs.forEach(g=>{ eco.demand[k.id][g]=Math.min(3,eco.demand[k.id][g]+1); }));
  // abgelaufene, nicht angenommene Aufträge verfallen
  eco.orders=eco.orders.filter(o=>{
    if(o.state!=='open' || day<=(o.expires??o.deadline)) return true;
    if(o.bulk){ eco.bulk[o.from][o.good]=(eco.bulk[o.from][o.good]||0)+o.n; }
    else { const src=o.fwdOrder?eco.fwd[o.from]:eco.stock[o.from]; src[o.good]=(src[o.good]||0)+o.n; }
    if(!o.transship) eco.demand[o.to][o.good]=Math.min(3,eco.demand[o.to][o.good]+1);
    return false;
  });
  KONTORE.forEach(k=>{
    k.makes.forEach(g=>makeOrder(k,g,false,day));
    if(k.hub) Object.keys(eco.fwd[k.id]).forEach(g=>makeOrder(k,g,true,day));
  });
  bulkTick(day);
}
// Großaufträge: Jeder Erzeuger füllt nebenher ein Großlager. Ist die Losgröße erreicht, entsteht ein Auftrag,
// der mehr Container hat, als die Kogge laden kann (7 bis 18).
function bulkTick(day){
  const eco=S.eco;
  if(!eco.bulk){ eco.bulk={}; eco.bulkN={}; }
  KONTORE.forEach(k=>k.makes.forEach(g=>{
    const B_=eco.bulk[k.id]=eco.bulk[k.id]||{}, N=eco.bulkN[k.id]=eco.bulkN[k.id]||{};
    if(!N[g]) N[g]=randInt(BULK.min,BULK.max);
    B_[g]=(B_[g]||0)+1/(GOODS[g].rate*BULK.slow);
    if(B_[g]<N[g] || eco.orders.some(o=>o.bulk && o.state==='open' && o.from===k.id && o.good===g)) return;
    const n=N[g];
    const cand=KONTORE.filter(c=>c.id!==k.id && c.needs.includes(g) && eco.demand[c.id][g]>0 && bodyOf(c)!==bodyOf(k) && route(k,c).dv<=MAX_ROUTE_DV);
    const hubs=Object.values(HUBS).filter(h=>h.id!==k.id && bodyOf(h)!==bodyOf(k) && hubRoom(h)>=n && route(k,h).dv<=MAX_ROUTE_DV);
    if(!cand.length && !hubs.length) return;
    let to, transship=false;
    if(cand.length && (!hubs.length || Math.random()<0.6)) to=pickWeighted(cand,c=>eco.demand[c.id][g]);
    else { to=hubs[Math.floor(Math.random()*hubs.length)]; transship=true; }
    const r=route(k,to); if(!isFinite(r.dv)) return;
    if(!transship) eco.demand[to.id][g]--;
    B_[g]-=n; N[g]=randInt(BULK.min,BULK.max);
    const wait=legWait(r,day);
    eco.orders.push({id:eco.nextId++, good:g, n, from:k.id, to:to.id, reward:Math.round(rewardFor(r,g,n)*BULK.premium/10)*10,
      dv:r.dv, days:r.days, deadline:day+wait+1.5*r.days+60, created:day, expires:day+BULK.life, state:'open', fwdOrder:false, transship, bulk:true});
  }));
}
// kleinstes Schiff, das n Container laden kann
const shipFor = n => Object.values(SHIPS).filter(s=>s.slots>=n).sort((a,b)=>a.price-b.price)[0];
function econAdvance(toDay){ while(S.eco.day+1<=toDay){ S.eco.day++; econTick(S.eco.day); } }

function newGame(){
  S={day:START_DAY, node:'earth.orbit', site:null, ship:'kogge', fuel:SHIPS.kogge.cap, used:0, credits:20000,
     visited:new Set(['earth.orbit']), flags:{delivered:0}, target:'mars', busy:false, transit:null, over:false,
     ui:{view:'main', sel:new Set(), tank:null, pick:null, route:null, auto:null, mapView:null},
     msg:'Kogge vollgetankt an der Orbitalwerft, 20.000 Cr in der Kasse. Nimm Aufträge an und bring die Fracht ans Ziel.'};
  S.eco=newEconomy(); econAdvance(START_DAY);
  // Aufträge aus der Vorlaufzeit starten mit voller Frist
  S.eco.orders.forEach(o=>{ const sh=START_DAY-o.created; o.deadline+=sh; o.expires+=sh; o.created=START_DAY; });
}

// ---------- Formatierung ----------
const km = m => (m/1000).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDays = d => d<1 ? `${Math.max(1,Math.round(d*24))} Std.` :
  d<730 ? (Math.round(d)===1?'1 Tag':`${Math.round(d)} Tage`) : `${(d/365.25).toLocaleString('de-DE',{maximumFractionDigits:1})} Jahre`;
const dateStr = day => new Date(Date.UTC(2000,0,1,12)+day*864e5)
  .toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
const here = () => S.node ? S.node.split('.') : [null,null];
const homePlanet = () => { const [k]=here(); return k && M[k] ? M[k].parent : k; };
const planetGen = k => k==='earth'?'der Erde':k==='venus'?'der Venus':'von '+B[k].name;
const nodeName = node => { const [k,l]=node.split('.');
  if(l==='surf' && S.site){ const st=siteOf(k,S.site); if(st) return `${st.name} (${M[k]?M[k].name:B[k].name})`; }
  if(M[k]) return l==='surf' ? (M[k].surfName||`Oberfläche von ${M[k].name}`) : (M[k].orbitName||`Orbit um ${M[k].name}`);
  return `${LVL[l]} ${planetGen(k)}`; };

// ---------- Aktionen ----------
function localActions(){
  const [k,l]=here(); const A=[];
  const add=(label,dv,days,to,x={})=>A.push({label,dv,days,to,...x});
  if(!k) return A;
  const landings=(body,down,baseNote)=>{
    (SITES[body]||[]).forEach(st=>{
      const pen=hasAtm(body)?0:rotPenalty(body,st.lat);
      const bits=[latStr(st.lat)];
      if(st.port) bits.push('Weltraumbahnhof');
      if(st.depot) bits.push(`Tankstelle (${st.depot} Tage)`);
      add(`Landen: ${st.name}`,down+pen,0.2,body+'.surf',{site:st.id,lat:st.lat,note:bits.join(', ')+(st.note?`. ${st.note}`:'')});
    });
  };
  const launch=(body,up,label)=>{
    const st=siteOf(body,S.site), lat=st?st.lat:0, pen=rotPenalty(body,lat);
    const rotNote=(ROT[body]||0)>=20 ? `Start bei ${latStr(lat)}: ${Math.round((ROT[body]||0)-pen)} von ${ROT[body]} m/s Rotationsbonus` : '';
    return {lat,pen,rotNote};
  };
  if(l==='surf' && S.site) (SITES[k]||[]).forEach(st=>{
    if(st.id===S.site) return;
    const h=hopCost(k,S.site,st.id), full=bodyUp(k)+bodyDown(k);
    const fee=h.launcher?Math.round(LAUNCH_FEE*(eng().dry+cargoMass()+S.fuel)*HOP_FEE_SHARE):0;
    add(`${h.launcher?'Suborbitaler Flug':'Ballistischer Hüpfer'} nach ${st.name}`,h.dv,h.days,k+'.surf',{site:st.id,lat:st.lat,hop:true,...(fee?{fee}:{}),
      note:`${Math.round(h.th*180/Math.PI)}° Bogen${h.launcher?`, Gebühr ${fmtCr(fee)}`:`, ${Math.round((1-h.dv/full)*100)} % billiger als über den Orbit`}`});
  });
  if(M[k]){
    const m=M[k], p=m.parent;
    if(l==='surf'){ const L=launch(k); add(`Aufstieg in den ${m.orbitName||'Orbit um '+m.name}`,m.up+L.pen,0.2,k+'.orbit',{note:[m.upNote,L.rotNote].filter(Boolean).join('. '),lat:L.lat}); }
    else {
      landings(k,m.down);
      add(`Zurück in den hohen Orbit ${planetGen(p)}`,m.xfer,m.days,p+'.capt');
    }
  } else {
    const b=B[k];
    if(l==='surf'){
      const L=launch(k);
      if(b.surf.launcher){ const fee=Math.round(LAUNCH_FEE*(eng().dry+cargoMass()+S.fuel));
        add('Mit Trägerrakete in den Orbit',L.pen,1,k+'.orbit',{lat:L.lat,fee,note:`Startgebühr ${fmtCr(fee)}${fee>S.credits?', wird gestundet':''}. Fehlender Rotationsbonus kommt aus deinem Tank. ${L.rotNote}`}); }
      else add('Aufstieg in den Orbit',b.surf.up+L.pen,0.2,k+'.orbit',{lat:L.lat,note:L.rotNote});
    }
    if(l==='orbit'){
      if(b.surf) landings(k,b.surf.down);
      add('In den hohen Orbit',captDv(k),1,k+'.capt',{note:'Ausgangspunkt für Transfers und Monde'});
    }
    if(l==='capt'){
      add('Abstieg in den niedrigen Orbit',captDv(k),1,k+'.orbit');
      if(b.atm) add('Aerobremsen in den niedrigen Orbit',60,40,k+'.orbit',{note:'Viele Durchgänge durch die obere Atmosphäre'});
      moonsOf(k).forEach(m=>add(`Zum ${M[m].name==='Mond'?'Mond':'Mond '+M[m].name}`,M[m].xfer,M[m].days,m+'.orbit',{note:`Einschuss in den Orbit um ${M[m].name}`+(hasDepot(m)?', Tankstelle auf der Oberfläche':'')}));
    }
  }
  return A;
}

function arrive(node,site){
  S.node=node; S.visited.add(node);
  S.site = node.endsWith('.surf') ? site : null;
  if(site) S.visited.add(node.split('.')[0]+'@'+site);
  if(node==='mars.surf') S.flags.marsLanded=true;
  if(S.flags.marsLanded && node.startsWith('earth.')) S.flags.marsReturn=true;
}

// Karte ins Blickfeld holen, falls sie gerade nicht sichtbar ist
function showMap(el){
  el = el || document.querySelector('.maptabs');
  const r=el.getBoundingClientRect();
  const visible = r.top>=0 && r.top < window.innerHeight*0.5;
  if(!visible) el.scrollIntoView({behavior: reduce?'auto':'smooth', block:'start'});

// Die Startgebühr wird notfalls gestundet: Das Konto darf dafür ins Minus, nur nicht bis zum Konkurs.
const feeBlocked = a => !!a.fee && S.credits-a.fee < BANKRUPT;
function doAction(a){
  if(S.busy || S.over || a.disabled || a.dv>dvAvail()+0.5 || feeBlocked(a)) return;
  if(a.fee) S.credits-=a.fee;
  burn(a.dv); S.busy=true;
  // Bewegung merken, damit System- und Körperansicht das Schiff unterwegs zeigen
  S.move={from:{node:S.node, site:S.site}, to:{node:a.to, site:a.site||null}, d0:S.day, d1:S.day+a.days, hop:!!a.hop, aero:/Aerobrems/.test(a.label||'')};
  S.move.orb = S.orb && S.orb.body===S.node.split('.')[0] ? {...S.orb} : null;
  S.move.path = bodyPath(S.move);
  S.move.sys = sysPlan(S.move);
  render();
  if(a.to && (M[a.to.split('.')[0]] && a.to.endsWith('.orbit') && !S.node.endsWith('.surf') || M[here()[0]] && a.to.endsWith('.capt'))) showMap();
  const ms = S.move.sys ? (S.move.aero ? 3400 : 2400) : S.move.path ? (a.to.endsWith('.surf')&&!a.hop ? 2600 : 1900) : Math.max(800, Math.min(1500, 400+a.days*20));
  animateTo(S.day+a.days, ms*SLOW, ()=>{
    const pth=S.move.path, spl=S.move.sys; S.move=null;
    if(spl) Object.assign(sysState(planetOfBody(a.to.split('.')[0])), spl.final);
    // Orbitzustand für die 3D-Ansicht: nach dem Start die Startbahn, sonst äquatorial vorne
    if(a.to.endsWith('.orbit')){ const tb=a.to.split('.')[0]; S.orb = pth && pth.finalOrb ? {...pth.finalOrb} : defaultOrb(tb); } else if(a.to.endsWith('.surf')) S.orb=null;
    arrive(a.to,a.site); S.msg=`${a.label}: ${km(a.dv)} km/s verbraucht. Jetzt: ${nodeName(a.to)}.`;
    S.busy=false; render(); autoFill();
  });
}

function doTransfer(b){
  const a=homePlanet(); if(S.busy || S.over || S.node!==a+'.capt') return;
  const t=transfer(a,b,S.day); if(t.total>dvAvail()) return;
  burn(t.total);
  const dep=S.day, arr=S.day+t.tof;
  S.transit={a,b,dep,arr,th0:theta(a,dep),th1:theta(b,arr)};
  S.node=null; S.busy=true; S.ui.mapView=null; S.msg=`Unterwegs nach ${B[b].name}. Ankunft am ${dateStr(arr)}.`; render(); showMap();
  animateTo(arr, 2800*SLOW, ()=>{
    S.transit=null; arrive(b+'.capt');
    S.msg=`Angekommen: hoher Orbit um ${B[b].name} nach ${fmtDays(t.tof)}. Einschuss und Einfang kosteten ${km(t.total)} km/s.`;
    S.busy=false; render(); autoFill();
  });
}

function waitDays(n){
  if(S.busy || S.over) return; S.busy=true; render(); showMap();
  animateTo(S.day+n, Math.min(2400,350+n*5)*1.3, ()=>{ S.busy=false; S.msg=`${fmtDays(n)} vergangen.`; render(); });
}

// „Immer volltanken“: an jeder Tankstelle so viel tanken, wie in den Tank passt und bezahlbar ist
function autoFill(){
  if(!S.autoFill || S.busy || S.over) return false;
  const r=refuelInfo(); if(!r || r.need<0.5 || r.max<0.5) return false;
  doRefuel(r.max,true); return true;
}

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animationen laufen gemächlich; ein Tippen auf die Karte beschleunigt (beim Autopilot bis zum Ziel)
const SLOW = 2.3, FAST = 6;
const ANIM = {active:false, fast:false, long:false};
function animateTo(target, ms, done){
  const d0=S.day; if(reduce) ms=Math.min(ms,150);
  S.anim={d0, d1:target}; ANIM.active=true; ANIM.long=ms>1500; speedHint();
  let prog=0, last=performance.now();
  const step=now=>{
    const dt=Math.min(100,now-last); last=now;
    prog=Math.min(1, prog+dt/ms*(ANIM.fast?FAST:1));
    const p=prog, e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    S.day=d0+(target-d0)*e; header(); draw();
    if(p<1) requestAnimationFrame(step);
    else { S.day=target; S.anim=null; ANIM.active=false; if(!S.ui.auto) ANIM.fast=false; speedHint(); econAdvance(S.day); done(); }
  };
  requestAnimationFrame(step);
}
function speedHint(){ const h=document.getElementById('speedhint'); if(!h) return;
  const show=ANIM.active && (ANIM.long||ANIM.fast); h.hidden=!show; if(!show) return;
  h.textContent = ANIM.fast ? '» schneller' : 'Tippen: schneller'; h.classList.toggle('on',ANIM.fast); }

// ---------- Wirtschaft: Aktionen ----------
function acceptOrder(o){
  if(S.busy||S.over) return;
  const k=kontorAt(); if(!k || k.id!==o.from || o.state!=='open') return;
  if(slotsUsed()+o.n>eng().slots) return;
  o.deadline=freshDeadline(o,S.day); o.created=S.day;
  o.state='aboard'; S.msg=`Angenommen: ${o.n} × ${GOODS[o.good].name} nach ${kontorLabel(KBY[o.to])}. Frist ${dateStr(o.deadline)}.`; render();
}
function removeOrder(o){ S.eco.orders=S.eco.orders.filter(x=>x!==o); }
function deliverOrder(o,silent){
  if(S.busy||S.over) return;
  const pay=payout(o); S.credits+=pay; removeOrder(o);
  if(o.transship){ const f=S.eco.fwd[o.to]; f[o.good]=(f[o.good]||0)+o.n; S.flags.hubDelivery=true; }
  S.flags.delivered=(S.flags.delivered||0)+1;
  if(silent) return;
  S.msg=`Abgeliefert: ${o.n} × ${GOODS[o.good].name}. ${fmtCr(pay)} gutgeschrieben${pay<o.reward?' (verspätet)':''}.`; render();
}
function returnOrder(o){
  if(S.busy||S.over) return;
  o.state='open'; S.msg=`Zurückgegeben: ${o.n} × ${GOODS[o.good].name}. Kostenlos, weil du noch am Startkontor bist.`; render();
}
function abortOrder(o){
  const pen=Math.round(o.reward*0.2);
  if(S.busy||S.over||pen>S.credits) return;
  S.credits-=pen; removeOrder(o);
  if(!o.transship) S.eco.demand[o.to][o.good]=Math.min(3,S.eco.demand[o.to][o.good]+1);
  S.msg=`Auftrag abgebrochen. Strafe ${fmtCr(pen)}, die Ladung ist verloren.`; render();
}
function buyShip(id){
  const net=SHIPS[id].price-0.7*eng().price;
  if(S.busy||S.over||net>S.credits||slotsUsed()>SHIPS[id].slots) return;
  S.busy=true; render();
  animateTo(S.day+5, 500, ()=>{
    S.credits-=net; S.ship=id; S.fuel=Math.min(S.fuel,eng().cap); S.flags.bought=true;
    S.msg=`Neues Schiff: ${eng().name} mit ${eng().slots} Frachtplätzen. ${fmtCr(net)} bezahlt.`;
    S.busy=false; render();
  });
}
let strandCache={key:null,val:false};
function stranded(){
  if(S.busy||S.over||!S.node) return false;
  const ri=refuelInfo();
  if(ri){ // Tankstelle hier, aber kein Geld
    if(!(ri.need>1 && ri.max<Math.min(ri.need,5)) || deliverables().length) return false;
    // Nur gestrandet, wenn der Treibstoff an Bord für keinen Auftrag mehr reicht: weder für die Fracht an Bord
    // noch für einen offenen Auftrag von hier noch bis zu einem anderen Kontor mit Aufträgen.
    const key=['k',locKey(),Math.round(S.fuel*10),cargoMass(),S.ship,Math.floor(S.day/10)].join('|');
    if(strandCache.key!==key){
      const dv=dvAvail(), k=kontorAt(), me={id:'@'+locKey(), node:S.node, site:S.site};
      const cargoOk=cargoOrders().length && cargoOrders().every(o=>route(me,KBY[o.to]).dv<=dv+0.5);
      const hereOk=k && S.eco.orders.some(o=>o.state==='open' && o.from===k.id && dvWith(S.fuel,cargoMass()+o.n*GOODS[o.good].m)>=o.dv);
      // Anderswo: Anfahrt plus Auftragsroute müssen zusammen mit dem Treibstoff an Bord machbar sein
      const awayOk=!cargoOrders().length && KONTORE.some(kk=>{ if(kk===k) return false; const d1=route(me,kk).dv; if(d1>dv+0.5) return false;
        return S.eco.orders.some(o=>o.state==='open'&&o.from===kk.id && d1+o.dv<=dvWith(S.fuel,o.n*GOODS[o.good].m)+0.5); });
      strandCache={key, val:!(cargoOk||hereOk||awayOk)};
    }
    return strandCache.val;
  }
  const key=[locKey(),Math.round(S.fuel*10),cargoMass(),S.ship,Math.floor(S.day/30)].join('|');
  if(strandCache.key!==key){ strandCache={key, val: nearestFuel({node:S.node,site:S.site,day:S.day}).dv > dvAvail()+0.5}; }
  return strandCache.val;
}
// Notbetankung: ein Tanker bringt vor Ort einen vollen Tank. Anfahrt je nach Region.
const RESCUE_DAYS = {werft:20, pavonis:90, valhalla:200};
function rescueInfo(){
  const ri=refuelInfo(), amount=eng().cap-S.fuel;
  if(ri) return {amount, cost:Math.round(2000+ri.price*amount), days:ri.days, lift:false, local:true};
  const cost=Math.round(RESCUE_BASE+RESCUE_PER_T*amount);
  const days=RESCUE_DAYS[REGION[here()[0]]]||60;
  // Reicht selbst ein voller Tank für kein Manöver (Venus-Oberfläche), hebt der Tanker das Schiff in den Orbit
  const lift=!localActions().some(a=>a.to && a.dv<=dvWith(eng().cap,cargoMass())+0.5);
  return {amount,cost,days,lift};
}
function rescue(){
  if(!stranded()) return;
  const r=rescueInfo();
  S.credits-=r.cost; S.busy=true; render(); showMap();
  animateTo(S.day+r.days, 900, ()=>{
    S.fuel=eng().cap;
    if(r.lift){ S.node=here()[0]+'.orbit'; S.site=null; }
    S.busy=false;
    if(S.credits<BANKRUPT){ S.over=true; S.msg=`Konkurs. Dein Kontostand liegt bei ${fmtCr(S.credits)}. Starte neu, um es noch einmal zu versuchen.`; }
    else if(r.local) S.msg=`Auf Kredit getankt: ${tons(r.amount)} für ${fmtCr(r.cost)}. Dein Konto steht bei ${fmtCr(S.credits)}.`;
    else S.msg=`Der Tanker ist da (${fmtDays(r.days)} Anfahrt): ${tons(r.amount)} für ${fmtCr(r.cost)}.${r.lift?' Der Tanker hat dich außerdem in den Orbit gehoben.':''} Deine Fracht ist noch an Bord.`;
    render();
  });
}

// Markierungen für Manöver: Lieferziele, Richtung zur Fracht, Kontore mit Aufträgen
function cargoHints(){
  const H={step:[], transfer:{}};
  if(!S.node) return H;
  const me={id:'@'+locKey(), node:S.node, site:S.site}, hereK=kontorAt();
  const byDest={};
  cargoOrders().forEach(o=>{ if(!hereK||hereK.id!==o.to) byDest[o.to]=(byDest[o.to]||0)+1; });
  Object.keys(byDest).forEach(id=>{
    const r=route(me,KBY[id]); if(!r.first) return;
    const name=KBY[id].name;
    if(r.first.leg){ const p=r.first.leg[1]; (H.transfer[p]=H.transfer[p]||[]).includes(name)||H.transfer[p].push(name); }
    else H.step.push({node:r.first.node, site:r.first.site, dv:r.first.dv, name, n:byDest[id], final: KBY[id].node===r.first.node && (!KBY[id].site||KBY[id].site===r.first.site)});
  });
  return H;
}
function actionTags(a,H){
  const T=[];
  if(a.to){
    const k=KONTORE.find(k=>k.node===a.to && (!k.site || k.site===(a.site||null) || (!a.site && k.node==='earth.surf')));
    H.step.filter(s=>s.node===a.to && (s.site||null)===(a.site||null) && Math.abs(s.dv-a.dv)<1).forEach(s=>{
      T.push(s.final?{cls:'deliver',txt:`Lieferziel: ${s.n} ${s.n>1?'Aufträge':'Auftrag'}`}:{cls:'toward',txt:`Richtung ${s.name}`});
    });
    if(k && !T.some(t=>t.cls==='deliver')){
      const n=S.eco.orders.filter(o=>o.state==='open'&&o.from===k.id).length;
      T.push({cls:'kontor',txt:`Kontor${n?`, ${n} ${n>1?'Aufträge':'Auftrag'}`:''}`});
    }
  }
  return T;
}

// ---------- Wirtschaft: Darstellung ----------
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gchip = g => `<span class="gchip" style="background:${GOODS[g].color}"></span>`;
const tons = t => `${t.toLocaleString('de-DE',{maximumFractionDigits:1})} t`;
function dots(n){ return `<span class="dots">${[0,1,2].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`; }
function btn(label,cls,disabled,fn){ const b=document.createElement('button'); b.textContent=label; if(cls) b.className=cls; b.disabled=disabled; b.onclick=fn; return b; }

// ---------- Ansichten (Kontor, Laderaum, Tanken, Werft) ----------
const isDesk = () => matchMedia('(min-width:900px)').matches;
const BACKNAME = {main:'Karte', kontor:'Auftragsbrett', fracht:'Laderaum', route:'Route'};
function openView(v,back){ S.ui.rmsg=false; S.ui.back = v==='main' ? null : (back||null); S.ui.view=v; S.ui.sel=new Set(); S.ui.tank=null; render();
  if(isDesk()){ const cs=document.querySelector('.col-side'); if(cs) cs.scrollTop=0; } else window.scrollTo({top:0}); }
function refuelInfo(){
  if(!S.node) return null;
  const [k,l]=here(), st=l==='surf'?siteOf(k,S.site):null, days=st?st.depot:DEPOTS[S.node], price=fuelPrice();
  if(days===undefined || price===undefined) return null;
  const need=Math.max(0,eng().cap-S.fuel), afford=Math.max(0,S.credits)/price;
  return {days, price, need, max:Math.min(need,afford), source: st?(k==='earth'?'Betankung am Weltraumbahnhof':'Treibstoff aus lokalem Eis'):'Tankdepot im Orbit'};
}
function doRefuel(amount,keepView){
  const r=refuelInfo(); if(!r || S.busy || S.over) return;
  amount=Math.min(amount,r.max); if(amount<0.1) return;
  const cost=Math.round(amount*r.price);
  S.busy=true; if(!keepView){ const back=S.ui.view==='tanken'?S.ui.back:null; S.ui.view=back||'main'; S.ui.back=null; } render();
  animateTo(S.day+r.days, Math.min(1200,300+r.days*15), ()=>{
    S.fuel=Math.min(eng().cap,S.fuel+amount); S.credits-=cost; S.flags['refuel:'+here()[0]+'@'+S.site]=true;
    S.msg=`Getankt: ${tons(amount)} für ${fmtCr(cost)}. ${km(dvAvail())} km/s verfügbar.`; S.busy=false; render();
  });
}
// Δv, das die Fracht an Bord von hier aus höchstens braucht
function routeNeedHere(){
  if(!S.node) return 0;
  const me={id:'@'+locKey(), node:S.node, site:S.site};
  return cargoOrders().reduce((mx,o)=>Math.max(mx, KBY[o.to]===kontorAt()?0:route(me,KBY[o.to]).dv),0);
}
const fuelFor = (dv,cm) => (eng().dry+cm)*(Math.exp(dv/(eng().isp*G0))-1);
const deliverables = () => { const k=kontorAt(); return k ? cargoOrders().filter(o=>o.to===k.id) : []; };
function deliverAll(){ const list=deliverables(); if(!list.length||S.busy||S.over) return;
  let sum=0; list.forEach(o=>{ sum+=payout(o); deliverOrder(o,true); });
  S.msg=`${list.length} ${list.length>1?'Aufträge':'Auftrag'} abgeliefert, ${fmtCr(sum)} gutgeschrieben.`; render(); }
function acceptSelected(){
  const k=kontorAt(); if(!k||S.busy||S.over) return;
  const list=S.eco.orders.filter(o=>S.ui.sel.has(o.id) && o.state==='open' && o.from===k.id);
  const n=list.reduce((s,o)=>s+o.n,0); if(!list.length || slotsUsed()+n>eng().slots) return;
  list.forEach(o=>{ o.deadline=freshDeadline(o,S.day); o.created=S.day; o.state='aboard'; });
  S.msg=`${list.length} ${list.length>1?'Aufträge':'Auftrag'} angenommen, ${n} Container geladen.`;
  openView('fracht');
}

function phead(title, sub, tag){

function panelKontor(p){
  const k=kontorAt(); if(!k) return openView('main');
  const eco=S.eco, locked=S.busy||S.over, free=eng().slots-slotsUsed();
  p.appendChild(phead(`Kontor ${k.name}`, `${esc(kontorPlace(k))}. ${fmtCr(S.credits)}, ${free} ${free===1?'Frachtplatz':'Frachtplätze'} frei.`, k.hub?'Drehkreuz':''));
  const del=deliverables();
  if(del.length){
    const b=document.createElement('div'); b.className='banner';
    b.innerHTML=`<span>${del.length} ${del.length>1?'Aufträge':'Auftrag'} an Bord ${del.length>1?'gehen':'geht'} hierher.</span>`;
    b.appendChild(btn(`Abliefern, ${fmtCr(del.reduce((s,o)=>s+payout(o),0))}`,'go',locked,deliverAll)); p.appendChild(b);
  }
  const sel=eco.orders.filter(o=>S.ui.sel.has(o.id));
  const selN=sel.reduce((s,o)=>s+o.n,0), selM=sel.reduce((s,o)=>s+o.n*GOODS[o.good].m,0), selR=sel.reduce((s,o)=>s+o.reward,0);
  const offers=eco.orders.filter(o=>o.state==='open' && o.from===k.id);
  const h=document.createElement('h3'); h.textContent=`Aufträge ab hier (${offers.length})`; p.appendChild(h);
  const bigHere=offers.filter(o=>o.n>eng().slots);
  if(bigHere.length){ const hb=document.createElement('p'); hb.className='hint';
    hb.textContent=`${bigHere.length} ${bigHere.length>1?'Großaufträge passen':'Großauftrag passt'} nicht in deine ${eng().name} (${eng().slots} Plätze). Größere Schiffe gibt es an der Werft der Drehkreuze.`; p.appendChild(hb); }
  const list=document.createElement('div'); list.className='ogroups';
  if(!offers.length) list.innerHTML='<p class="hint">Gerade keine Aufträge. Die Lager füllen sich mit der Zeit.</p>';
  // Nach Zielort gruppieren, Gruppen nach Δv der Route sortieren
  const groups={};
  offers.forEach(o=>{ (groups[o.to]=groups[o.to]||[]).push(o); });
  const glist=Object.entries(groups).map(([to,os])=>{
    const tk=KBY[to], tpl=planRoute({node:tk.node, site:tk.site||(tk.node==='earth.surf'?'kourou':null)},'eco');
    return {tk, os:os.sort((a,b)=>b.reward-a.reward), tpl, dv:tpl?tpl.dv:os[0].dv, days:tpl?tpl.days:os[0].days};
  }).sort((a,b)=>a.dv-b.dv);
  glist.forEach(G0=>{
    const {tk,os,tpl}=G0, dl=freshDeadline(os[0],S.day), lateBy=tpl?tpl.arrive-dl:0;
    const gSel=os.filter(o=>S.ui.sel.has(o.id));
    const lightest=os.filter(o=>!S.ui.sel.has(o.id)).reduce((m,o)=>Math.min(m,o.n*GOODS[o.good].m),Infinity);
    const after = gSel.length ? dvWith(S.fuel,cargoMass()+selM) : dvWith(S.fuel,cargoMass()+selM+(isFinite(lightest)?lightest:0));
    const short = after < G0.dv;
    const afterFull = gSel.length ? dvWith(eng().cap,cargoMass()+selM) : dvWith(eng().cap,cargoMass()+selM+(isFinite(lightest)?lightest:0));
    const grp=document.createElement('section'); grp.className='ogroup'+(gSel.length?' on':'');

    grp.innerHTML=`<div class="og-head"><div class="og-title"><b>${esc(kontorLabel(tk))}</b>${tk.hub?' <span class="tag">Drehkreuz</span>':''}${nDel?` <span class="mtag deliver">schon ${nDel} an Bord</span>`:''}</div>
      <div class="og-meta"><span class="${short?'badc':''}">${km(G0.dv)} km/s</span><span>${fmtDays(G0.days)}</span><span class="${lateBy>0?'badc':''}">Frist ${dateStr(dl)}</span></div>
      ${lateBy>0?`<div class="o-warn bad">Frist nicht zu schaffen: Ankunft frühestens ${dateStr(tpl.arrive)}.</div>`:
        short?`<div class="o-warn">${gSel.length?'Mit deiner Auswahl':'Selbst mit dem leichtesten Auftrag'} bleiben ${km(after)} km/s. ${afterFull<G0.dv?`Zu schwer: Auch vollgetankt wären es nur ${km(afterFull)} km/s.`:'Vorher tanken.'}</div>`:''}</div>`;
    const rl=routeLink(tk,'kontor'); rl.style.marginLeft='auto'; grp.querySelector('.og-meta').appendChild(rl);
    os.forEach(o=>{
      const Gd=GOODS[o.good], on=S.ui.sel.has(o.id), fits=on || slotsUsed()+selN+o.n<=eng().slots;
      const el=document.createElement('label'); el.className='orow'+(on?' on':'')+(fits?'':' dis');
      const tooBig=o.n>eng().slots, need=tooBig?shipFor(o.n):null;
      const why = fits ? '' : tooBig ? `, braucht ${o.n} Plätze: ${need?need.name+' oder größer':'kein Schiff groß genug'}` : `, braucht ${o.n} ${o.n>1?'Plätze':'Platz'}`;
      el.innerHTML=`<input type="checkbox" ${on?'checked':''} ${(!fits||locked)?'disabled':''}>${gchip(o.good)}<span class="ot"><b>${o.n} × ${Gd.name}${o.bulk?' <span class="mtag kontor">Großauftrag</span>':''}</b><small>${tons(o.n*Gd.m)}${why}</small></span><span class="num">${fmtCr(o.reward)}</span>`;
      el.querySelector('input').onchange=e=>{ e.target.checked?S.ui.sel.add(o.id):S.ui.sel.delete(o.id); render(); };
      grp.appendChild(el);
    });
    list.appendChild(grp);
  });
  p.appendChild(list);

  if(k.needs.length){
    const h2=document.createElement('h3'); h2.textContent='Hier gesucht'; p.appendChild(h2);
    const g=document.createElement('div'); g.className='needgrid';
    g.innerHTML=k.needs.map(x=>`<div class="card">${gchip(x)} ${GOODS[x].name}${dots(eco.demand[k.id][x])}</div>`).join('');
    p.appendChild(g);
    const n=document.createElement('p'); n.className='hint';
    n.textContent=k.hub?`Punkte zeigen den Bedarf. Als Drehkreuz nimmt ${k.name} außerdem jedes Gut zum Umschlag an; belegt sind ${HUB_CAP-hubRoom(k)} von ${HUB_CAP} Plätzen.`:'Punkte zeigen den Bedarf. Aufträge hierher entstehen in anderen Kontoren.';
    p.appendChild(n);
  }

  const f=document.createElement('div'); f.className='pfoot';

  f.innerHTML=`<div class="row"><span>Auswahl: ${selN} Container, ${tons(selM)}</span><b>${fmtCr(selR)}</b></div>
    <div class="row dvrow"><span class="muted">Δv</span><b>${km(before)}</b><span class="muted">→</span><b class="acc">${km(after)} km/s</b><span class="muted">nach Annahme</span></div>`;
  f.appendChild(btn(sel.length?`${sel.length} ${sel.length>1?'Aufträge':'Auftrag'} annehmen`:'Aufträge auswählen','go wide',locked||!sel.length,acceptSelected));
  p.appendChild(f);
}

}

const SAVE_KEY='transferfenster-v2', SLOT_KEY='transferfenster-slot1';
function save(){
  if(S.busy||!S.node) return;
  try{ const o={...S, visited:[...S.visited]}; delete o.transit; delete o.ui; delete o.move; delete o.anim; localStorage.setItem(SAVE_KEY, JSON.stringify(o)); }catch(e){}
}
let memSlot=null; // Rückfall, wenn der Browser localStorage sperrt
function load(key){
  try{
    let t=null; try{ t=localStorage.getItem(key||SAVE_KEY); }catch(e){}
    if(!t && key===SLOT_KEY) t=memSlot;
    if(!t) return false;
    const o=JSON.parse(t); if(!o.eco || !SHIPS[o.ship] || !o.node) return false;
    S={...o, visited:new Set(o.visited), busy:false, transit:null, move:null, anim:null, ui:{view:'main', sel:new Set(), tank:null, pick:null, route:null, auto:null, mapView:null}};
    S.msg='Spielstand geladen.'; return true;
  }catch(e){ return false; }
}

// ---------- Kartennavigation: Ansicht ----------
const SYSNAME = {earth:'Erdsystem', mars:'Marssystem', jupiter:'Jupitersystem', saturn:'Saturnsystem'};
const BODYCOL = {moon:'#a8a49c', phobos:'#8e8378', deimos:'#9a9086', io:'#d8c35a', europa:'#cfc6b2', ganymede:'#a89f92', callisto:'#7f776d', enceladus:'#e6ecf0', titan:'#d9a441'};
const bodyColor = b => B[b] ? B[b].color : (BODYCOL[b]||'#9a958d');
// Automatik: Transfer → Sonnensystem; im niedrigen Orbit oder am Boden → Körper mit Landeplätzen;
// im hohen Orbit → Systemkarte, außer der nächste Schritt zur Fracht ist ein interplanetarer Transfer.
function autoView(){
  if(S.transit || !S.node) return {level:'sol'};
  const [k,l]=here(), hp=homePlanet(), moons=moonsOf(hp).length>0;
  if(S.move){
    const [fb,fl]=S.move.from.node.split('.'), [tb,tl]=S.move.to.node.split('.');
    if(fb===tb && fl!=='capt' && tl!=='capt' && SITES[fb]) return {level:'body', planet:hp, body:fb};
    if(moons) return {level:'sys', planet:hp};
    if(SITES[fb]) return {level:'body', planet:hp, body:fb};
    return {level:'sol'};
  }
  if(l==='capt'){
    if(!moons) return {level:'sol'};
    const h=cargoHints();
    if(!cargoOrders().length || (Object.keys(h.transfer).length && !h.step.length)) return {level:'sol'};
    return {level:'sys', planet:hp};
  }
  if(SITES[k]) return {level:'body', planet:hp, body:k};
  return moons ? {level:'sys', planet:hp} : {level:'sol'};
}
function mapView(){
  const key=S.transit?'transit':(S.move?'mv:'+S.move.to.node+(S.move.to.site||'')+'|':'')+(S.node||'')+(S.site||'');
  if(S.ui.mapKey!==key){ S.ui.mapKey=key; S.ui.mapView=null; }
  return S.ui.mapView||autoView();
}
function setView(v){ S.ui.mapView=v; S.ui.pick=null; render(); }
function renderCrumbs(v){
  const nav=$('crumbs'); nav.innerHTML='';
  const segs=[{t:'Sonnensystem', v:{level:'sol'}}];
  if(v.planet && moonsOf(v.planet).length) segs.push({t:SYSNAME[v.planet]||B[v.planet].name, v:{level:'sys', planet:v.planet}});
  if(v.level==='body') segs.push({t:bodyName(v.body), v});
  segs.forEach((sg,i)=>{
    if(i) { const s=document.createElement('span'); s.className='sep'; s.textContent='›'; s.setAttribute('aria-hidden','true'); nav.appendChild(s); }
    const last=i===segs.length-1, b=document.createElement('button'); b.type='button'; b.textContent=sg.t;
    b.className=last?'cur':''; if(last) b.setAttribute('aria-current','page');

  g.font=`600 15px 'Saira Semi Condensed','Arial Narrow',sans-serif`;

// Karte eines Körpers. Ohne Besonderheiten gibt es keine Karte, dann genügt die Grundfarbe.
function glSurface(T,b){
  const caps=CAPS[b]||[], gas=b==='jupiter'||b==='saturn', earth=b==='earth';
  if(!caps.length && !gas && !earth) return null;
  const col=bodyColor(b), cn=texCanvas(TEX_W,TEX_H), g=cn.getContext('2d');
  g.fillStyle=col; g.fillRect(0,0,TEX_W,TEX_H);
  if(earth){
    LAND.forEach((pts,i)=>texPoly(g,pts,EARTH_LAND(i)));
    DESERT.forEach(([pts,fill])=>texPoly(g,pts,fill));
    WATER.forEach(pts=>texPoly(g,pts,col)); // Binnenmeere wieder aufmachen
  }
  if(gas) texBands(g);
  caps.forEach(([lat,a])=>texCap(g,lat,a));

}
// Saturnring: Bänder über den Radius, innen und außen durchsichtig. Die Cassini-Teilung
// sitzt bei knapp zwei Dritteln, wie in der Natur.
function glRingTexture(T){
  const N=512, cn=texCanvas(N,N), g=cn.getContext('2d'), c=N/2;
  const inner=0.614; // 1,35 von 2,2 Saturnradien: der Ring beginnt nicht am Planeten
  const band=(r0,r1,fill)=>{ g.beginPath(); g.arc(c,c,r1*c,0,TAU); g.arc(c,c,r0*c,0,TAU,true);
    g.fillStyle=fill; g.fill('evenodd'); };
  band(inner,1,'rgba(222,205,160,0.72)');
  band(inner,inner+0.06,'rgba(198,182,142,0.4)');   // innerer, blasser Rand
  band(0.80,0.845,'rgba(0,0,0,0)');                  // Cassini-Teilung
  g.globalCompositeOperation='destination-out'; band(0.80,0.845,'rgba(0,0,0,0.85)');
  g.globalCompositeOperation='source-over';
  band(0.86,0.95,'rgba(236,224,190,0.5)');
  band(0.97,1,'rgba(200,186,150,0.25)');
  const t=new T.CanvasTexture(cn); t.colorSpace=T.SRGBColorSpace; t.anisotropy=GL.aniso; return t;
}

function glInit(T){
  let r;
  try{ r=new T.WebGLRenderer({canvas:glc, alpha:true, antialias:true, powerPreference:'low-power'}); }
  catch(e){ glOff('kein WebGL-Kontext'); return; }
  GL.T=T; GL.r=r;
  r.setClearAlpha(0);
  r.setPixelRatio(Math.min(2, window.devicePixelRatio||1)); // mobil: höchstens 2
  r.autoClear=false;
  GL.aniso=Math.min(4, r.capabilities.getMaxAnisotropy());
  glc.addEventListener('webglcontextlost', e=>{ e.preventDefault(); glOff('WebGL-Kontext verloren'); });

  GL.scene=new T.Scene();
  GL.cam=new T.OrthographicCamera(-1,1,1,-1,1,4000);
  GL.cam.position.set(0,0,2000);
  // Das Licht steht im Weltraum der Szene, also in Kamerakoordinaten: genau der Vektor LIGHT
  // aus der 2D-Schattierung. Die Körper hängen in einer gedrehten Gruppe, das Licht nicht.
  const dl=new T.DirectionalLight(0xfff3e0, 1.25), amb=new T.AmbientLight(0x93a4d2, 0.2);
  dl.position.set(LIGHT[0]*500, LIGHT[1]*500, LIGHT[2]*500);
  GL.dl=dl; GL.amb=amb;
  GL.scene.add(dl, dl.target, amb);
  GL.root=new T.Group(); GL.scene.add(GL.root);   // gedreht wie die Kamera in makeCam/drawSys
  GL.flat=new T.Group(); GL.scene.add(GL.flat);   // ungedreht: die Rakete in Bildschirmkoordinaten

  // Eine Kugel für alle Körper. phiStart so, dass Länge 0° nach +Z zeigt;
  // die Blickmitte je Körper kommt dann aus einer Drehung um Y.
  GL.sphere=new T.SphereGeometry(1, 64, 32, -Math.PI/2);
  GL.plane=new T.PlaneGeometry(2,2);
  GL.rocket=new T.Mesh(glRocketGeo(T), new T.MeshLambertMaterial({vertexColors:true, side:T.DoubleSide, transparent:true}));
  GL.rocket.scale.setScalar(RKT_LEN/1.25);
  GL.rocket.renderOrder=3; // nach den Bahnbändern, damit die blasse Rückseite nicht darüber liegt
  GL.rocket.visible=false; GL.flat.add(GL.rocket);
  GL.qa=new T.Quaternion(); GL.qb=new T.Quaternion();
  GL.AX=new T.Vector3(1,0,0); GL.AY=new T.Vector3(0,1,0); GL.AZ=new T.Vector3(0,0,1);
  GL.on=true; GL.state='an';
  draw();
}

function glMat(key){
  if(GL.mat[key]) return GL.mat[key];
  const T=GL.T, map=glSurface(T,key);
  return GL.mat[key]=new T.MeshLambertMaterial(map?{map}:{color:new T.Color(bodyColor(key))});
}
function glBody(key){
  if(GL.mesh[key]) return GL.mesh[key];
  const m=new GL.T.Mesh(GL.sphere, glMat(key));
  m.rotation.y=-bodyLon0(key)*D2R; // Blickmitte des Körpers nach +Z drehen
  GL.root.add(m); return GL.mesh[key]=m;
}
function glSaturnRing(){
  if(GL.ring) return GL.ring;
  const T=GL.T;
  const mat=new T.MeshBasicMaterial({map:glRingTexture(T), transparent:true, side:T.DoubleSide, depthWrite:false});
  const m=new T.Mesh(GL.plane, mat);
  m.rotation.x=-Math.PI/2; // Plane liegt in XY, der Ring gehört in die Äquatorebene XZ
  GL.root.add(m); return GL.ring=m;
}

// Eine Ansicht beginnen: Canvas auf die Größe des vorderen 2D-Canvas bringen,
// Kamera in Pixeln aufspannen und die Gruppe wie makeCam bzw. drawSys drehen.
// scale ist die Zahl der Pixel je Einheit in der Gruppe (drawBody: R, drawSys: 1).
function glBegin(front,W,H,cx,cy,scale,el){
  if(!GL.on) return false;
  glc.hidden=false; cvb.hidden=false;
  layFor(glc,front,W,H);
  GL.r.setSize(W,H,false);
  const c=GL.cam; c.left=-W/2; c.right=W/2; c.top=H/2; c.bottom=-H/2; c.updateProjectionMatrix();
  GL.root.position.set(cx-W/2, H/2-cy, 0);
  GL.root.rotation.set(el,0,0);
  GL.root.scale.setScalar(scale);
  GL.flat.position.set(-W/2, H/2, 0);
  for(const k in GL.mesh) GL.mesh[k].visible=false;
  for(const k in GL.path){ GL.path[k].ghost.visible=false; GL.path[k].solid.visible=false; }
  if(GL.ring) GL.ring.visible=false;
  GL.rocket.visible=false;

}
// Körper an eine Stelle der Gruppe setzen (p in Gruppenkoordinaten, r in Gruppeneinheiten)
function glPut(key,p,r){
  const m=glBody(key); m.visible=true; m.scale.setScalar(r);
  m.position.set(p?p[0]:0, p?p[1]:0, p?p[2]:0);

}
// Bahnen und Flugspuren als schmale Bänder aus Dreiecken. WebGL kann Linien nicht verbreitern
// (immer 1 px), ein Band dagegen hat genau die Breite und Strichelung des bisherigen 2D-Wegs.
// Gerechnet wird in Bildschirmkoordinaten plus Tiefe, also mit derselben Projektion wie in 2D.
function glPathGeo(pts,w,dash){
  const out=[], hw=w/2;
  let on=true, rem=dash?dash[0]:Infinity;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
    if(!(L>1e-6)) continue;
    const ux=dx/L, uy=dy/L, nx=-uy*hw, ny=ux*hw;
    let t=0;
    while(t<L-1e-9){
      const step=Math.min(L-t, rem);
      if(on){
        const s0=t/L, s1=(t+step)/L;
        const ax=a.x+dx*s0, ay=a.y+dy*s0, az=a.z+(b.z-a.z)*s0;
        const bx=a.x+dx*s1, by=a.y+dy*s1, bz=a.z+(b.z-a.z)*s1;
        out.push(ax-nx,-(ay-ny),az,  ax+nx,-(ay+ny),az,  bx+nx,-(by+ny),bz,
                 ax-nx,-(ay-ny),az,  bx+nx,-(by+ny),bz,  bx-nx,-(by-ny),bz);
      }
      t+=step; rem-=step;
      if(dash && rem<=1e-9){ on=!on; rem=on?dash[0]:dash[1]; }
    }
  }
  return out;
}
// Zwei Durchgänge: blass ohne Tiefentest (die Rückseite scheint gedämpft durch den Körper,
// wie bisher), darüber voll mit Tiefentest. So verdeckt die Rakete die Bahn und umgekehrt.
function glPath(key,pts,style){
  const T=GL.T, tri=glPathGeo(pts, style.w||1, style.dash||null), n=tri.length/3;
  let o=GL.path[key];
  if(!o){
    const gm=new T.BufferGeometry();
    const mk=(test,order)=>{ const m=new T.Mesh(gm,new T.MeshBasicMaterial({transparent:true,depthTest:test,depthWrite:test,side:T.DoubleSide}));
      m.renderOrder=order; m.frustumCulled=false; GL.flat.add(m); return m; };
    o=GL.path[key]={gm, ghost:mk(false,1), solid:mk(true,2), cap:0};
  }
  if(o.cap<n){ o.cap=Math.max(n,512); o.gm.setAttribute('position', new T.BufferAttribute(new Float32Array(o.cap*3),3)); }
  const at=o.gm.getAttribute('position');
  at.array.set(tri); at.needsUpdate=true; o.gm.setDrawRange(0,n);
  const a=style.a==null?1:style.a;
  o.ghost.material.color.set(style.col); o.ghost.material.opacity=a*(style.ghost==null?0.35:style.ghost);
  o.solid.material.color.set(style.col); o.solid.material.opacity=a;
  o.ghost.visible=o.solid.visible=n>0;
}

// Rakete in Bildschirmkoordinaten: x,y wie im 2D-Canvas, z die echte Tiefe in Pixeln, damit der
// Körper sie stückweise verdeckt. a ist der Bildschirmwinkel der Nase.
function glRocket(x,y,z,a,key,alpha){
  const m=GL.rocket, r=rollOf(key);
  m.visible=true; m.position.set(x,-y,z);
  m.material.opacity=alpha==null?1:alpha;
  GL.qa.setFromAxisAngle(GL.AY, r);
  GL.qb.setFromAxisAngle(GL.AX, RKT_TILT); GL.qa.premultiply(GL.qb);
  GL.qb.setFromAxisAngle(GL.AZ, a-Math.PI/2); GL.qa.premultiply(GL.qb);
  m.quaternion.copy(GL.qa);
}
function glEnd(){ if(!GL.on) return; GL.r.clear(); GL.r.render(GL.scene, GL.cam); }

function draw(){
  const v=mapView(); renderCrumbs(v); HITS=[];

// Transferbahn als Kegelschnitt um die Sonne durch Start (Radius r1) und Ziel (r2) über den Winkel dth.
// Nach außen: Perihel beim Start; nach innen: Aphel beim Start (für dth = 180° genau der Hohmann-Übergang).
// Zeitlich nach Kepler: gleiche Flächen in gleichen Zeiten, also schnell nah an der Sonne, langsam weit draußen.
function transferConic(r1,r2,dth){
  const out=r2>=r1;
  let e = out ? (r2-r1)/(r1-r2*Math.cos(dth)) : (r1-r2)/(r1-r2*Math.cos(dth));
  // gültige Ellipse nur für 0 ≤ e < 1 und dth deutlich > 0; sonst Rückfall auf weiche Überblendung
  const ok = isFinite(e) && e>=0 && e<0.97 && dth>0.2;
  if(!ok){ const f=s=>({r:r1+(r2-r1)*(0.5-0.5*Math.cos(Math.PI*s)), th:dth*s}); return {at:f, geo:s=>{const q=f(s); return [q.r,q.th];}}; }
  const p = out ? r1*(1+e) : r1*(1-e);
  const nu0 = out ? 0 : Math.PI, nu1 = nu0+dth;
  const rOfNu = nu => p/(1+e*Math.cos(nu));
  const Mof = nu => { const E=2*Math.atan2(Math.sqrt(1-e)*Math.sin(nu/2), Math.sqrt(1+e)*Math.cos(nu/2)); return E-e*Math.sin(E); };
  // mittlere Anomalie stetig machen (über 2π hinaus)
  const unwrap=(m,ref)=>{ while(m<ref-1e-9) m+=TAU; return m; };
  const M0=Mof(nu0), M1=unwrap(Mof(nu1),M0);
  const at=s=>{ const Mt=M0+(M1-M0)*s; const nu=keplerNu(Mt,e); let d=((nu-nu0)%TAU+TAU)%TAU; if(s>0.999) d=dth; return {r:rOfNu(nu0+d), th:d}; };
  return {at, geo:s=>{ const nu=nu0+dth*s; return [rOfNu(nu), dth*s]; }};
}
function drawSol(){
  const [W]=fitCanvas(cv,1); if(W<60) return; prep(cv,ctx,W,W);
  rocketMode='flach'; glHide(); // die Draufsicht aufs Sonnensystem bleibt flach
  const v=cssv(), c=W/2, maxR=W/2-20;
  const rOf=a=>16+(maxR-16)*Math.sqrt(a/9.537);
  const pos=(k,day)=>{const th=theta(k,day), r=rOf(B[k].a); return [c+r*Math.cos(th), c-r*Math.sin(th)];};
  ctx.lineWidth=1; ctx.strokeStyle=v('--orbit');
  PLANETS.forEach(k=>{ctx.beginPath(); ctx.arc(c,c,rOf(B[k].a),0,TAU); ctx.stroke();});
  ctx.fillStyle=v('--sun'); ctx.beginPath(); ctx.arc(c,c,6,0,TAU); ctx.fill();
  const from=homePlanet(), tgt=S.target;
  if(from && tgt && tgt!==from){
    const t=transfer(from,tgt,S.day), thA=theta(from,S.day), thG=thA+t.phiStar, rT=rOf(B[tgt].a);
    ctx.strokeStyle=t.d<0.04?v('--good'):v('--accent'); ctx.setLineDash([4,4]); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(c,c); ctx.lineTo(c+rT*Math.cos(thG), c-rT*Math.sin(thG)); ctx.stroke();
    ctx.beginPath(); ctx.arc(c+rT*Math.cos(thG), c-rT*Math.sin(thG), 10,0,TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha=.5; ctx.beginPath(); ctx.moveTo(c,c); const [ax,ay]=pos(from,S.day); ctx.lineTo(ax,ay); ctx.stroke(); ctx.globalAlpha=1;
    ctx.lineWidth=2; ctx.beginPath(); ctx.arc(c,c,26,-thA,-thG,t.phiStar>0); ctx.stroke();
  }
  ctx.font=`500 12px 'Saira Semi Condensed', 'Arial Narrow', sans-serif`; ctx.textBaseline='middle';
  const dests=new Set(cargoOrders().map(o=>planetOfBody(bodyOf(KBY[o.to]))));
  PLANETS.forEach(k=>{
    const [x,y]=pos(k,S.day), big=k==='jupiter'||k==='saturn'?6:k==='ceres'?3.5:4.5;
    ctx.fillStyle=bodyColor(k); ctx.beginPath(); ctx.arc(x,y,big,0,TAU); ctx.fill();
    if(dests.has(k)){ ctx.strokeStyle=v('--good'); ctx.lineWidth=1.5; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.arc(x,y,big+8,0,TAU); ctx.stroke(); ctx.setLineDash([]); }
    if(isPick({type:'planet',planet:k})){ ctx.strokeStyle=v('--accent'); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,big+13,0,TAU); ctx.stroke(); }
    const th=theta(k,S.day), lx=x+Math.cos(th)*16, ly=y-Math.sin(th)*16;
    ctx.fillStyle=isPick({type:'planet',planet:k})?v('--text'):v('--muted'); ctx.textAlign=Math.cos(th)>0.3?'left':Math.cos(th)<-0.3?'right':'center';
    ctx.fillText(B[k].name,lx,ly);
    HITS.push({canvas:cv,x,y,r:24,pick:{type:'planet',planet:k}});
    const ms=moonsOf(k); ctx.fillStyle=v('--muted');
    ms.forEach((m,i)=>{ const a=moonAngle(m,S.day), r=big+4+i*2.5; ctx.beginPath(); ctx.arc(x+r*Math.cos(a), y-r*Math.sin(a), 1.3,0,TAU); ctx.fill(); });
  });
  if(S.transit){
    const T=S.transit, rA=rOf(B[T.a].a), rB=rOf(B[T.b].a), dth=((T.th1-T.th0)%TAU+TAU)%TAU;
    const K=transferConic(rA,rB,dth);
    const pt=s=>{ const q=K.at(s), th=T.th0+q.th; return [c+q.r*Math.cos(th), c-q.r*Math.sin(th)]; };
    ctx.strokeStyle=v('--accent'); ctx.setLineDash([3,4]); ctx.lineWidth=1.5; ctx.beginPath();
    for(let i=0;i<=96;i++){const [x,y]=K.geo(i/96).map((z,j)=>z); const th=T.th0+y; const X=c+x*Math.cos(th), Y=c-x*Math.sin(th); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);} ctx.stroke(); ctx.setLineDash([]);
    const p=Math.min(1,Math.max(0,(S.day-T.dep)/(T.arr-T.dep))), [x,y]=pt(p), [x2,y2]=pt(Math.min(1,p+0.01));
    // Brennen beim Abflug (vorwärts) und bei der Ankunft (bremsen), davor dreht die Rakete
    const bAt=q=>q<0.04?'pro':q>0.955?'retro':null;
    drawRocket(ctx,'sol',x,y,Math.atan2(-(y2-y),x2-x),bAt(p),bAt(Math.min(1,p+0.05)),null,v('--accent'));
  } else if(S.node){
    const k=homePlanet(), [x,y]=pos(k,S.day), th=theta(k,S.day), off=k==='jupiter'||k==='saturn'?18:13;
    drawRocket(ctx,'solpark',x-Math.sin(th)*off, y-Math.cos(th)*off, th+Math.PI/2, null,null,null, v('--accent'));
  }
}
